  LESSONS.plateau=[
  [0,`## What is the Peninsular Plateau?
The Peninsular Plateau is the large, raised, triangle-shaped land south of the Northern Plains. It is surrounded by water on three sides, which is why it is called a peninsula. Its height is mostly between 600 and 900 m.`],
  [0,`## An ancient land
This is one of the oldest parts of India. It was once part of a huge ancient landmass called **Gondwanaland**. Its hard rocks are very old, so the plateau is stable and not shaken by big earthquakes as often as the Himalayas.`],
  [0,`## Why is it important?
It is rich in **minerals** such as coal, iron ore, mica and bauxite. Its black soil is excellent for cotton. Many rivers, forests and wildlife sanctuaries are found here, and the hills are good for tea, coffee and spices.`],
  [1,`## Two main parts
- **Central Highlands**: the northern part, which includes the Malwa Plateau, Bundelkhand and the Chota Nagpur Plateau.
- **Deccan Plateau**: the large triangular part south of the Narmada, between the Western and Eastern Ghats. "Deccan" comes from a word meaning "south".
In the north-east the plateau continues as the **Meghalaya (Shillong) Plateau**, which has the Garo, Khasi and Jaintia hills.`],
  [1,`## The two Ghats
- **Western Ghats** (Sahyadri): run close to the west coast, are tall and almost continuous, and catch the monsoon rain. **Anamudi** (2,695 m) in Kerala is the highest peak of peninsular India.
- **Eastern Ghats**: run along the east coast, are lower and broken into pieces by the big rivers. The Mahendragiri peak (about 1,500 m) is in Odisha.
The two meet at the **Nilgiri Hills** in the south.`],
  [2,`## Hills that frame the plateau
- **Aravalli**: one of the oldest fold mountain ranges in the world, in the north-west. Guru Shikhar (1,722 m) near Mount Abu is its highest point.
- **Vindhya** and **Satpura**: run east–west across central India. The Narmada flows west between them in a **rift valley**, and the Tapi flows west just south of the Satpura.
- **Palghat Gap** in the Western Ghats links Kerala and Tamil Nadu and carries roads and railways.`],
  [2,`## Deccan Trap and black soil
About 66 million years ago huge lava flows spread over much of Maharashtra, Madhya Pradesh, Gujarat and Karnataka. The lava cooled into black basalt rock called the **Deccan Trap**. When this rock weathered it formed **black soil** (regur), which holds moisture well and suits cotton. The lava flows are also the reason the plateau has flat tops and step-like slopes.`],
  [3,`## Rivers of the plateau
Most large rivers, such as the Mahanadi, Godavari, Krishna and Kaveri, flow east into the Bay of Bengal and build deltas. The Narmada and Tapi flow west through rift valleys and form estuaries. Because the plateau slopes gently from west to east, the main drainage runs eastward, and the rivers have fixed courses because they flow over hard rock.

## Minerals and the Chota Nagpur Plateau
Chota Nagpur (Jharkhand and nearby areas) is often called the mineral heartland of India. It has coal (the Damodar valley), iron ore, mica, bauxite and copper, and this supports steel plants at Jamshedpur, Bokaro and Rourkela.`],
  [4,`## Facts for State PCS
- Highest peaks: Anamudi (Western Ghats, Kerala), Doddabetta (Nilgiri, Tamil Nadu), Mahendragiri (Eastern Ghats, Odisha), Guru Shikhar (Aravalli, Rajasthan), Dhupgarh (Satpura, Madhya Pradesh).
- Western Ghats were declared a UNESCO World Heritage Site in 2012.
- Malwa, Bundelkhand and Baghelkhand are parts of the Central Highlands.

## Common exam traps
- The Western Ghats are higher and continuous; the Eastern Ghats are lower and broken.
- The Narmada and Tapi flow west, unlike most peninsular rivers.`],
  [5,`## Significance and issues (Mains view)
- **Mineral wealth versus forests**: mining and industry in Jharkhand, Odisha and Chhattisgarh raise questions about tribal rights, displacement and forest loss.
- **Biodiversity**: the Western Ghats are a global biodiversity hotspot, under pressure from mining, dams and plantations. The Gadgil and Kasturirangan committees studied how to protect them.
- **Water**: much of the plateau depends on monsoon rain, so droughts affect parts of Maharashtra, Karnataka and Telangana.

## Possible Mains questions
- Why is the Peninsular Plateau called a stable landmass, and how did its geological history shape its resources?
- Compare the Western and Eastern Ghats.`]
  ];
  LESSONS.desert=[
  [0,`## What is the Thar Desert?
The Thar, or Great Indian Desert, is a dry, sandy region in western India, mostly in Rajasthan. It also stretches into Pakistan. It has very little rain, big sand hills called **dunes**, and very hot days.`],
  [0,`## Life in the desert
- Summer days are extremely hot and winter nights can be cold.
- People keep camels, goats and sheep. Crops such as bajra (pearl millet) grow after the short rains.
- Jaisalmer, Bikaner and Jodhpur are famous desert cities, and the desert has bright folk music and colourful clothes.`],
  [0,`## Why is it so dry?
The monsoon winds that blow from the Arabian Sea move along the Aravalli hills instead of being forced to rise over them, so they bring very little rain to the area. The hot, dry air in the region also makes it hard for clouds to form.`],
  [1,`## Features of the desert
- **Sand dunes**: crescent-shaped dunes called **barchans** and long ridges called longitudinal dunes are common.
- **Salt lakes**: Sambhar (the largest inland salt lake in India), Didwana and Pachpadra produce salt.
- **Only one major river**: the **Luni**, which rises in the Aravallis and flows into the Rann of Kutch. Most other streams dry up in the sand.
- **Rainfall**: usually below about 150 mm a year in the driest parts, and it varies a lot from year to year.`],
  [2,`## Two parts of the desert
- **Marusthali** in the west is the true sandy desert with large dunes.
- **Bagar** in the east, nearer the Aravallis, gets a little more rain and has thin soil and scrub that can support some farming.
Rocky areas with bare ground are called *hamadas*, and temporary lakes in hollows, called *playas*, collect water after rain. In Rajasthan they are known locally as *ranns* or *dhands*.`],
  [2,`## Climate and farming
The desert has a hot desert climate with a very high daily range of temperature. Millets such as bajra, along with moth and guar, are the main crops. The **Indira Gandhi Canal**, which brings water from the Sutlej and Beas, has turned parts of Bikaner, Jaisalmer and Barmer into irrigated farmland. This is one of the largest irrigation projects in the country.`],
  [3,`## Processes
Wind is the main agent of change here. It lifts and carries sand (deflation), shapes dunes, and polishes rocks into mushroom-like forms. Heavy but short rain can cause sudden flash floods because the ground is dry and hard.

## Desertification
Overgrazing, cutting of trees and over-irrigation can cause desertification, meaning the desert spreads and good land turns dry and salty. Planting shelterbelts of trees and growing grass help stop the sand.`],
  [4,`## Facts for State PCS
- The Thar lies mostly in Rajasthan, with parts in Gujarat, Punjab and Haryana, and continues into Pakistan.
- Sambhar Lake is in Rajasthan, west of Jaipur.
- The Rann of Kutch in Gujarat is a salt marsh, not a sandy desert.
- Pokhran, in the Thar, is India's nuclear test site.
- Bhadla Solar Park in Rajasthan is one of the world's largest solar parks.

## Common exam traps
- The Rann of Kutch and the Thar are different regions.
- The Luni is the only large river, and it is seasonal.`],
  [5,`## Challenges and opportunities (Mains view)
- **Water scarcity** and the dependence on the Indira Gandhi Canal, which also raises problems of waterlogging and salinity.
- **Desertification** is a national concern. India is a party to the UN Convention to Combat Desertification.
- **Renewable energy**: high sunshine and open land make western Rajasthan a major centre for solar and wind power.
- **Climate change** may make rainfall even more uncertain.

## Possible Mains questions
- Explain the causes of aridity in the Thar and the measures taken to combat desertification.
- How has the Indira Gandhi Canal transformed the Thar region, and what new problems has it created?`]
  ];
  LESSONS.coast=[
  [0,`## India's long coastline
India has a coastline of about 7,500 km including its islands, with the Arabian Sea on the west, the Bay of Bengal on the east and the Indian Ocean in the south. The coast has narrow plains, beaches, ports and fishing villages.`],
  [0,`## Two coastal plains
- The **Western Coastal Plain** lies between the Western Ghats and the Arabian Sea. It is narrow, and it includes the Konkan, Karnataka and Malabar coasts.
- The **Eastern Coastal Plain** lies between the Eastern Ghats and the Bay of Bengal. It is wider and has the big river deltas.`],
  [0,`## Two groups of islands
- **Andaman and Nicobar Islands** in the Bay of Bengal.
- **Lakshadweep Islands** in the Arabian Sea, which are small coral islands.`],
  [1,`## The western coast in detail
It is a narrow strip, often under 80 km wide in places. From north to south it is called the **Konkan** (Maharashtra and Goa), the **Kannad** coast (Karnataka) and the **Malabar** coast (Kerala). Rivers here are short and fast and form estuaries, not deltas. Kerala has lagoons called **backwaters** (*kayals*), such as Vembanad.`],
  [1,`## The eastern coast in detail
It is broader and its rivers build large **deltas**: the Mahanadi, Godavari, Krishna and Kaveri. From north to south it is called the **Utkal** coast (Odisha), the **Andhra** or Northern Circars coast, and the **Coromandel** coast (Tamil Nadu). Chilika Lake in Odisha is the largest coastal lagoon in India. The east coast gets many cyclones from the Bay of Bengal.`],
  [2,`## Islands in detail
- **Andaman and Nicobar**: about 570 islands, formed from the tops of an undersea mountain range. The **Ten Degree Channel** separates the Andamans from the Nicobars. **Indira Point** on Great Nicobar is India's southernmost point. **Barren Island** has India's only active volcano.
- **Lakshadweep**: made of coral atolls, with around 36 islands and a very small total land area. The **Eight Degree Channel** separates Minicoy from the Maldives, and the **Nine Degree Channel** separates Minicoy from the rest of Lakshadweep.`],
  [2,`## Ports and trade
Major ports on the west include Kandla, Mumbai, Jawaharlal Nehru Port (Nhava Sheva), Mormugao and Kochi. On the east are Kolkata–Haldia, Paradip, Visakhapatnam, Chennai and Tuticorin. India also has an enormous trade by sea. Gujarat has the longest coastline of any state.`],
  [3,`## Coastal landforms
The west coast is mainly a **submergent** coast, which means sea level has risen over the land. This gives it good natural harbours and estuaries but few deltas. The east coast is mainly an **emergent** coast with wide plains and deltas, but fewer natural harbours. The Sundarbans and the Bhitarkanika forests are mangrove areas that protect the land from cyclones and storm surges.`],
  [4,`## Facts for State PCS
- Total coastline about 7,500 km including islands, of which the mainland coast is about 6,100 km.
- Gujarat has the longest coastline among the states. Andhra Pradesh has the second longest.
- Chilika (Odisha) is the largest lagoon, and Vembanad (Kerala) is the longest lake in India.
- Palk Strait separates India from Sri Lanka, and the Gulf of Mannar lies between them in the south.

## Common exam traps
- West coast rivers form estuaries, east coast rivers form deltas.
- Kanniyakumari is the southern tip of the mainland, but Indira Point is the southernmost point of India.`],
  [5,`## Issues and policy (Mains view)
- **Blue economy**: fisheries, ports, shipping and offshore energy offer large growth. The **Sagarmala** programme aims at port-led development.
- **Disasters**: cyclones, storm surges, tsunamis (the 2004 tsunami hit the east coast and the Andamans) and sea-level rise.
- **Coastal Regulation Zone** rules try to control building near the shore. Erosion, pollution and loss of mangroves are major concerns.
- **Strategic importance**: the Andaman and Nicobar Islands overlook the busy Malacca Strait route.

## Possible Mains questions
- Compare the east and west coastal plains of India with reference to landforms and economic activity.
- Discuss the strategic and economic importance of the Andaman and Nicobar Islands.`]
  ];
  LESSONS.himriv=[
  [0,`## Rivers that begin in the mountains
The Himalayan rivers start high in the mountains, where snow melts and feeds them. They carry water all year round, so they are called **perennial rivers**. The three big river systems are the **Indus**, the **Ganga** and the **Brahmaputra**.`],
  [0,`## The Ganga
The Ganga starts as the **Bhagirathi** from the Gangotri Glacier (Gaumukh) in Uttarakhand. At Devprayag it meets the Alaknanda, and from there it is called the Ganga. It flows through Uttar Pradesh, Bihar and West Bengal and falls into the Bay of Bengal. It is about 2,525 km long and is the most sacred river of India. Its helpers (tributaries) include the **Yamuna**, **Ghaghara**, **Gandak** and **Kosi**.`],
  [0,`## The Indus and the Brahmaputra
- The **Indus** rises near Lake Mansarovar in Tibet and enters India in Ladakh. Its tributaries in India include the Jhelum, Chenab, Ravi, Beas and Sutlej, and it flows on into Pakistan.
- The **Brahmaputra** rises in Tibet, where it is called the Tsangpo. It enters India in Arunachal Pradesh as the Dihang (Siang) and flows through Assam. It creates the river island of **Majuli**.`],
  [1,`## Features of Himalayan rivers
- They are fed by both glaciers and rain, so they never dry up completely.
- They have long courses and cut deep valleys and gorges in the mountains.
- On the plains they form meanders, oxbow lakes, wide flood plains and deltas.
- They carry a lot of silt, which makes the plains fertile but also causes floods.`],
  [1,`## The Ganga system in detail
- **Right-bank tributaries** (from the peninsula): Yamuna, Son, Chambal and Betwa (the last two join the Yamuna).
- **Left-bank tributaries** (from the Himalaya): Ramganga, Gomti, Ghaghara, Gandak, Kosi.
- The Ganga splits near Farakka: the **Bhagirathi–Hooghly** flows through West Bengal, and the main stream flows into Bangladesh as the Padma, where it meets the Brahmaputra and the Meghna before reaching the Bay of Bengal.`],
  [2,`## The Indus system
The Indus is about 2,880 km long, but only part of it lies in India. Its five eastern tributaries give Punjab its name, which means "land of five waters". The **Indus Waters Treaty (1960)** between India and Pakistan gave India the use of the three eastern rivers (Ravi, Beas and Sutlej) and Pakistan the western rivers (Indus, Jhelum and Chenab), with India allowed limited uses such as run-of-the-river hydropower.`],
  [2,`## The Brahmaputra system
The river is about 2,900 km long and carries a very large volume of water. In Assam it is wide and braided, with sandbars and islands, and it floods often. Its main tributaries in India include the Subansiri, Manas and Teesta (which joins it in Bangladesh). Because of heavy rain in the north-east, the Brahmaputra basin has one of the highest levels of annual rainfall.`],
  [3,`## Antecedent drainage and river capture
Rivers like the Indus, Sutlej and Brahmaputra cross the Himalaya in deep gorges. They were there before the mountains rose, so they cut down as fast as the land lifted. This is called **antecedent drainage**.
## Delta
The Ganga–Brahmaputra delta is the largest in the world. Its seaward side is covered by the **Sundarbans**, a mangrove forest and UNESCO World Heritage Site.`],
  [4,`## Facts for State PCS
- Prayags (confluences) of the Ganga: Vishnuprayag, Nandprayag, Karnaprayag, Rudraprayag and Devprayag. At Prayagraj the Ganga meets the Yamuna.
- The Ganga was declared the National River in 2008.
- Tehri Dam is on the Bhagirathi. Bhakra Nangal is on the Sutlej. Pong Dam is on the Beas.
- The Kosi is the "Sorrow of Bihar".

## Common exam traps
- The Brahmaputra and Indus both rise in Tibet but enter India at different places: Arunachal Pradesh and Ladakh.
- The Yamuna is a tributary of the Ganga, but the Chambal and Betwa are tributaries of the Yamuna.`],
  [5,`## Issues (Mains view)
- **Pollution and conservation**: the Ganga Action Plan began in 1985. The **Namami Gange** programme, launched in 2014, works on sewage treatment, riverfront development and ecological flow. The Ganga is also being protected by the National Mission for Clean Ganga.
- **Transboundary water**: the Indus Waters Treaty, the Ganga treaty with Bangladesh and the Teesta water-sharing question show how rivers shape foreign policy. China's activity on the Tsangpo raises concerns about the Brahmaputra.
- **Floods and erosion**: especially in Assam and Bihar. River courses shift, and embankments bring mixed results.
- **Climate change**: glacier retreat can first increase and later reduce river flow.

## Possible Mains questions
- Why are Himalayan rivers perennial while peninsular rivers are seasonal?
- Discuss the challenges of managing transboundary rivers in South Asia.`]
  ];
  LESSONS.penriv=[
  [0,`## Rivers of the peninsula
Most rivers of south India begin in the hills of the Western Ghats and the plateau and depend on **rain**, so they are full in the monsoon and smaller in summer. Because they are rain-fed, they are called **seasonal rivers**.`],
  [0,`## Rivers that flow east
Most big peninsular rivers flow east and fall into the Bay of Bengal. The main ones are the **Mahanadi**, **Godavari**, **Krishna** and **Kaveri**. The Godavari is the longest (about 1,465 km) and is sometimes called "Dakshin Ganga".`],
  [0,`## Rivers that flow west
The **Narmada** and the **Tapi** flow west into the Arabian Sea. Many shorter rivers also flow down the steep Western Ghats and quickly reach the Arabian Sea.`],
  [1,`## Features
- They have fixed courses because they flow over hard rock and have little silt to shift.
- They are shorter and smaller than Himalayan rivers.
- The east-flowing rivers make **deltas**, which are very fertile rice-growing areas.
- The west-flowing Narmada and Tapi make **estuaries**.
- Their valleys are broad and shallow, with waterfalls where they leave the plateau, such as **Jog Falls** on the Sharavathi.`],
  [1,`## Major rivers at a glance
- **Godavari**: rises at Trimbak near Nashik; flows through Maharashtra, Telangana and Andhra Pradesh.
- **Krishna**: rises near Mahabaleshwar; tributaries include the Tungabhadra, Bhima and Koyna.
- **Kaveri**: rises at Talakaveri in the Brahmagiri hills in Karnataka; flows through Tamil Nadu and forms a delta; Shivanasamudra Falls are on it.
- **Mahanadi**: rises in Chhattisgarh; the Hirakud Dam is on it in Odisha.
- **Narmada**: rises at Amarkantak; flows about 1,312 km west; the Sardar Sarovar Dam is on it.
- **Tapi**: rises at Multai in Madhya Pradesh; flows west through Maharashtra and Gujarat past Surat.`],
  [2,`## Why do the Narmada and Tapi flow west?
They flow through long, narrow **rift valleys** (faulted troughs). The Narmada runs between the Vindhya and the Satpura, and the Tapi runs just south of the Satpura. The rift lies on a line of weakness, so the rivers follow it west, while most of the plateau slopes east. This is why they form estuaries and not deltas: they carry little silt and flow in a deep, straight channel.`],
  [2,`## Drainage patterns
The Western Ghats form the main water divide. The rivers on the western slope are short and fast, with a steep gradient. East of the divide the rivers flow gently over the plateau for hundreds of kilometres. Rivers such as the Chambal, Betwa and Son flow north and join the Ganga system, which shows that the peninsula also drains north in part.`],
  [3,`## Basins and dams
The Godavari has the largest basin among peninsular rivers. Large dams include Hirakud (Mahanadi), Nagarjuna Sagar and Srisailam (Krishna), Mettur (Kaveri) and Sardar Sarovar (Narmada). Because peninsular rivers are seasonal, dams are needed to store the monsoon water for irrigation and electricity.`],
  [4,`## Facts for State PCS
- Longest peninsular river: Godavari. Longest west-flowing river: Narmada.
- Tributaries of the Godavari: Pranhita, Indravati, Manjra; of the Krishna: Tungabhadra, Bhima, Koyna; of the Kaveri: Hemavati, Bhavani, Amaravati.
- Dudhsagar Falls are on the Mandovi in Goa.
- The Kaveri delta is the "granary of the south".

## Common exam traps
- Narmada and Tapi are the exceptions that flow west.
- The Tungabhadra is a tributary of the Krishna.`],
  [5,`## Issues (Mains view)
- **Inter-state water disputes**: the Kaveri dispute between Karnataka and Tamil Nadu, the Krishna and Godavari tribunals, and the Mahadayi dispute between Karnataka and Goa show how federal systems struggle to share seasonal rivers. The Inter-State River Water Disputes Act of 1956 sets up tribunals.
- **Interlinking of rivers**: the Ken–Betwa link project is an example of moving water from surplus to deficit areas, and it raises ecological and displacement concerns.
- **Rehabilitation and ecology**: projects such as Sardar Sarovar involve displacement of people and changes to the river downstream.

## Possible Mains questions
- Why are inter-state river water disputes common in peninsular India?
- Contrast the drainage patterns and delta formation of Himalayan and peninsular rivers.`]
  ];
  LESSONS.monsoon=[
  [0,`## What is the monsoon?
The monsoon is a wind that changes direction with the season. In summer it blows from the sea towards the land and brings heavy rain. In winter it blows from the land towards the sea and the weather is dry. India gets most of its yearly rain from the **south-west monsoon** between June and September.`],
  [0,`## Four seasons of India
- **Winter** (December to February): cool and dry in the north, with some snow in the mountains.
- **Summer** (March to May): hot and dry, with hot winds called the **loo** in the north.
- **Monsoon** (June to September): the rainy season; rain first reaches Kerala around 1 June.
- **Retreating monsoon** (October to November): the rains go back, and Tamil Nadu gets rain.`],
  [0,`## Why does the monsoon matter?
Farmers depend on the monsoon for rice, cotton and many other crops. If it comes late or is weak, there can be a drought; if it is too strong, there can be floods. That is why people watch it so carefully.`],
  [1,`## How does the monsoon form?
In summer the land of north India gets much hotter than the Indian Ocean, so air over the land rises and a low-pressure area forms. Cool, wet winds from the ocean then rush in to fill the gap. They cross the equator and turn to the right because of the Earth's spin, so they arrive from the south-west. The winds hit the Western Ghats and the Himalaya and are forced to rise, cool and drop their water as rain.`],
  [1,`## Where does it rain most and least?
- Very heavy rain: the windward slopes of the **Western Ghats** and the north-east. **Mawsynram** and **Cherrapunji** in Meghalaya are among the wettest places on Earth.
- Little rain: the **rain-shadow** side of the Western Ghats, such as Pune, and the Thar Desert.
- The monsoon splits into two branches, the **Arabian Sea branch** and the **Bay of Bengal branch**, which together cover most of India.`],
  [2,`## Local winds and storms
- **Loo**: a hot, dry afternoon wind of the north-western plains in May and June.
- **Kalbaishakhi** (Nor'westers): thunderstorms in Bengal and Assam in April and May.
- **Mango showers**: pre-monsoon showers in Kerala and Karnataka that help ripen mangoes.
- **Western disturbances**: systems from the Mediterranean region that bring winter rain and snow to north-west India, helpful for wheat.
- **Retreating monsoon**: rain on the Coromandel coast (Tamil Nadu) in October and November from the north-east winds.`],
  [2,`## Climate regions
India has a **tropical monsoon climate**, but it varies by region: cold and snowy in the high Himalaya, hot desert in the Thar, humid tropical in Kerala and the north-east, and semi-arid in the interior plateau. Rainfall decreases from east to west across the Ganga plain and from the coast to the interior.`],
  [3,`## Factors behind the monsoon
- **Differential heating** of land and sea, and the movement of the **Inter-Tropical Convergence Zone (ITCZ)** northward over the Ganga plain in summer.
- The **Tibetan Plateau** heats strongly in summer, which helps pull the monsoon in. Upper-air currents, the **Tropical Easterly Jet** and the shift of the **Subtropical Westerly Jet** north of the Himalaya, are linked to the monsoon's onset.
- **El Niño** (warm Pacific waters) often brings a weaker monsoon, while **La Niña** often brings a stronger one. The **Indian Ocean Dipole**, a temperature difference across the Indian Ocean, also matters: a positive phase usually helps the monsoon.`],
  [4,`## Facts for State PCS
- Monsoon onset in Kerala: about 1 June. It covers the whole country by around 8 July (normal date), and withdraws from north-west India from about September.
- Mawsynram has the highest annual average rainfall. Jaisalmer is one of the driest places.
- Tamil Nadu gets most of its rain from the north-east (retreating) monsoon.
- The **India Meteorological Department (IMD)** forecasts the monsoon.

## Common exam traps
- Western disturbances bring winter rain to the north-west. They are not part of the monsoon.
- The loo is hot and dry, not humid.`],
  [5,`## Issues (Mains view)
- **Monsoon variability and climate change**: more intense short bursts of rain and longer dry spells affect crops, floods and water security. Agricultural drought and flood risk can occur in the same season.
- **Dependence of farming**: only part of India's farmland is irrigated, so rain-fed farming is exposed to risk. Crop insurance, micro-irrigation and drought-resistant crops are policy responses.
- **Forecasting**: better models and satellite data help early warning for cyclones, floods and heat waves.

## Possible Mains questions
- Explain the mechanism of the Indian monsoon and the role of El Niño and the Indian Ocean Dipole.
- "Monsoon is the real finance minister of India." Discuss.`]
  ];
  LESSONS.soils=[
  [0,`## What is soil?
Soil is the thin top layer of the earth in which plants grow. It is made from broken rock mixed with dead plants and animals, air and water. India has many kinds of soil because it has many kinds of rock, climate and rainfall.`],
  [0,`## Main soils of India
- **Alluvial soil**: brought by rivers; found in the Northern Plains; very fertile; good for wheat, rice and sugarcane.
- **Black soil**: found in the Deccan; holds water well; best for cotton.
- **Red soil**: found in the south and east; gets its colour from iron; good for millets, pulses and groundnut with fertiliser.
- **Laterite soil**: found in heavy rainfall areas such as Kerala and Karnataka; good for tea, coffee and cashew.
- **Desert soil**: sandy and dry, found in Rajasthan.
- **Mountain soil**: found in the hills, good for orchards and tea.`],
  [0,`## Why save soil?
Soil takes hundreds of years to form but can be washed or blown away quickly. Planting trees, ploughing along slopes and terrace farming protect it.`],
  [1,`## Alluvial soil in detail
It covers about 40 per cent of India and is found along the Indus, Ganga and Brahmaputra plains and in the east coast deltas. It is rich in potash and lime but poor in nitrogen and humus. **Khadar** is the newer alluvium, and **Bhangar** is the older alluvium with kankar nodules.`],
  [1,`## Black soil (regur) in detail
Black soil formed from the weathering of lava (basalt) in the Deccan Trap region: Maharashtra, Gujarat, Madhya Pradesh, Karnataka and parts of Andhra Pradesh and Telangana. It is rich in iron, lime, calcium and magnesium but poor in nitrogen, phosphorus and organic matter. It is sticky when wet and cracks deeply when dry, which helps natural aeration.`],
  [2,`## Red, laterite and others
- **Red and yellow soil**: forms on old crystalline rocks in Tamil Nadu, Karnataka, Andhra Pradesh, Odisha and Chhattisgarh. It is poor in nitrogen, humus and lime.
- **Laterite soil**: formed by heavy rain and high temperature, which leach (wash out) nutrients and leave iron and aluminium. It is acidic and low in nutrients. *Later* is the Latin word for brick, because the soil hardens like brick when dry.
- **Arid (desert) soil**: sandy, saline and low in humus, with kankar layers beneath.
- **Peaty (marshy) soil**: found in Kerala (called *kari*), the Sundarbans and parts of Odisha, with much organic matter.
- **Saline and alkaline soils**: called *reh*, *kallar* or *usar*, found in Punjab, Haryana and Uttar Pradesh where irrigation and poor drainage have brought salts to the surface.`],
  [3,`## Classification and formation
The **Indian Council of Agricultural Research (ICAR)** groups Indian soils into eight main types: alluvial, black, red, laterite, arid, saline, peaty and forest. Soil formation depends on **parent rock**, **climate**, **relief**, **organisms** and **time**. Heavy rain and heat produce leached soil, while dry conditions produce salty soil. Soil horizons (layers, such as the A, B and C horizons) show how deep the soil is and how mature it is.`],
  [4,`## Facts for State PCS
- Alluvial soil is the most widespread (about 40 per cent). Black soil is also called regur or "black cotton soil".
- Laterite soil is found in the Western Ghats, Eastern Ghats and parts of Odisha, Karnataka, Kerala and Assam.
- **Soil Health Card Scheme** (launched 2015) gives farmers a report on their soil's nutrients.

## Common exam traps
- Black soil is poor in nitrogen and phosphorus but rich in lime, iron and magnesium.
- Laterite soil is acidic and low in nutrients; it is not the same as red soil.`],
  [5,`## Issues (Mains view)
- **Soil erosion and degradation**: water erosion forms gullies and ravines (as in the Chambal), wind erosion spreads in the west, and over-irrigation causes salinity and waterlogging.
- **Nutrient imbalance**: heavy use of nitrogen fertiliser changes soil health. Balanced use of fertiliser, organic matter and crop rotation are needed.
- **Conservation methods**: contour ploughing, terrace farming, strip cropping, shelter belts, check dams and afforestation.

## Possible Mains questions
- Describe the major soil types of India and relate each to the crops grown on it.
- What are the causes of soil degradation in India, and what measures are being taken to check it?`]
  ];
  LESSONS.forests=[
  [0,`## Forests of India
Forests cover roughly a fifth of India's land. They give us wood, fruits, medicines and clean air, and they are home to tigers, elephants, rhinos, lions and thousands of other plants and animals. Forests also stop soil from washing away and help bring rain.`],
  [0,`## Main kinds of forest
- **Evergreen forests**: tall, thick and always green; found where rain is very heavy, as in the Western Ghats, the north-east and the Andaman Islands.
- **Deciduous forests**: trees drop their leaves in the dry season; teak and sal are examples; the most widespread type in India.
- **Thorny forests**: small thorny trees and bushes in dry areas such as Rajasthan.
- **Mangrove forests**: salt-loving trees in muddy coastal areas such as the Sundarbans.
- **Mountain forests**: pine, deodar and fir in the Himalayas.`],
  [0,`## Protecting wildlife
Special areas called **national parks** and **wildlife sanctuaries** protect animals and plants. Famous ones are Kaziranga (one-horned rhinoceros), Jim Corbett (tiger), Gir (Asiatic lion) and Ranthambore (tiger).`],
  [1,`## Types of forest and rainfall
- **Tropical evergreen**: more than 200 cm rain; trees such as mahogany and ebony.
- **Tropical moist deciduous**: 100 to 200 cm rain; teak, sal, sandalwood. Found in the Western Ghats, Chota Nagpur and the Shiwalik foothills.
- **Tropical dry deciduous**: 70 to 100 cm rain; mostly in the interior of the peninsula.
- **Tropical thorn**: less than 70 cm rain; babool, acacia and cactus; in Rajasthan, Gujarat and parts of Karnataka.
- **Montane**: changes with height, from temperate forests to alpine meadows.
- **Mangrove**: in the Sundarbans, the Mahanadi, Godavari and Krishna deltas and Bhitarkanika.`],
  [2,`## Conservation tools
- **Project Tiger** began in 1973, with Jim Corbett National Park as the first reserve. **Project Elephant** began in 1992.
- The **Wildlife (Protection) Act, 1972** protects species and sets up parks and sanctuaries.
- The **Forest Conservation Act, 1980** controls the use of forest land for other purposes.
- **Biosphere reserves** protect large areas and also allow limited human use. Nilgiri (1986) was the first biosphere reserve.
- India's biodiversity hotspots are the **Himalaya**, the **Indo-Burma** region, the **Western Ghats and Sri Lanka**, and **Sundaland**, which includes the Nicobar Islands.`],
  [3,`## Why are the Western Ghats special?
The windward slopes get very heavy rain, so they hold evergreen and moist deciduous forests with many species found nowhere else (endemic species), such as the lion-tailed macaque and the Nilgiri tahr. The Eastern Himalaya has a rich mix of species because it lies where several biogeographic zones meet.

## Forest and people
Forests are used by millions of forest-dwelling people. The **Forest Rights Act, 2006** recognises the rights of tribal and other forest dwellers over land and minor forest produce.`],
  [4,`## Facts for State PCS
- National parks: Kaziranga and Manas (Assam), Jim Corbett (Uttarakhand), Gir (Gujarat), Ranthambore and Keoladeo (Rajasthan), Kanha and Bandhavgarh (Madhya Pradesh), Periyar (Kerala), Bandipur (Karnataka), Simlipal (Odisha), Dachigam (Jammu and Kashmir), Hemis (Ladakh).
- The Sundarbans has the largest area of mangroves in India and is famous for the Royal Bengal tiger.
- **Keibul Lamjao** in Manipur is the only floating national park in the world.

## Common exam traps
- Gir is the only home of the wild Asiatic lion; it is in Gujarat.
- Nanda Devi National Park and the Valley of Flowers are in Uttarakhand and together are a UNESCO World Heritage Site.`],
  [5,`## Issues (Mains view)
- **Human–wildlife conflict**: elephants entering fields, leopards entering towns, and tigers leaving shrinking reserves.
- **Diversion of forest land** for mining, roads and dams, and the debate over compensatory afforestation.
- **Balance between conservation and livelihoods**: the Forest Rights Act and community forest management. The Joint Forest Management approach involves villagers.
- **Climate role**: forests store carbon, and India's commitments under climate agreements include increasing forest and tree cover.
- **Invasive species and forest fires** are growing concerns.

## Possible Mains questions
- Discuss the causes of human–wildlife conflict in India and ways to reduce it.
- How can India balance development needs with forest conservation?`]
  ];
  LESSONS.lakes=[
  [0,`## What is a lake?
A lake is a large body of water surrounded by land. Some lakes are made by nature, and some are made by people who build dams. India has lakes of fresh water and lakes of salty water.`],
  [0,`## Famous lakes
- **Dal Lake** in Srinagar is known for its houseboats.
- **Wular Lake** in Kashmir is the largest freshwater lake in India.
- **Chilika Lake** in Odisha is the largest coastal lagoon, famous for birds.
- **Sambhar Lake** in Rajasthan is the largest inland salt lake.
- **Loktak Lake** in Manipur has floating islands of plants.
- **Vembanad Lake** in Kerala is surrounded by backwaters.`],
  [0,`## Why do lakes matter?
They give drinking water, fish, water for farms and homes for migratory birds. They also keep the climate around them cooler and help recharge groundwater.`],
  [1,`## How lakes are formed
- **Glacial lakes**: dug by glaciers in the Himalayas, such as many lakes in Ladakh and Sikkim.
- **Tectonic lakes**: formed by movement of the earth, such as Wular.
- **Lagoons**: shallow lakes separated from the sea by a sandbar, such as Chilika and Pulicat.
- **Salt lakes** of the desert, such as Sambhar, Didwana and Pachpadra.
- **Oxbow lakes** (cut-off river bends) on the plains.
- **Crater lake**: Lonar in Maharashtra lies in a hollow made by a meteorite.
- **Reservoirs**: made by dams, such as Gobind Sagar behind the Bhakra Dam.`],
  [2,`## Wetlands
A **wetland** is an area of marsh, fen, peat land or water, natural or artificial, permanent or seasonal. Wetlands clean water, control floods, store carbon and support rich life. India's biggest wetland is the Sundarbans. The **Ramsar Convention** of 1971 is an international treaty for protecting important wetlands, and India has designated many Ramsar sites, such as Chilika, Keoladeo, Loktak and the Sundarbans.`],
  [3,`## Threats and management
Wetlands face pollution, encroachment, siltation, invasive plants (such as water hyacinth) and over-extraction of water. Too many nutrients from farms and sewage cause **eutrophication**: algae multiply, use up the oxygen and kill fish. The **Montreux Record** lists Ramsar sites where changes in ecological character have occurred or are likely, and Keoladeo and Loktak are on it. India's **Wetlands (Conservation and Management) Rules, 2017** and the National Wetland Conservation Programme aim to protect them.`],
  [4,`## Facts for State PCS
- Largest freshwater lake in India: Wular (J&K). Largest brackish-water lagoon: Chilika (Odisha). Largest inland saline lake: Sambhar (Rajasthan). Longest lake: Vembanad (Kerala). Largest freshwater lake in the north-east: Loktak (Manipur).
- Pulicat is a lagoon on the Andhra Pradesh–Tamil Nadu border.
- Pangong Tso is a high-altitude lake in Ladakh, shared with Tibet.
- Hussain Sagar is in Hyderabad; Pushkar is in Rajasthan; Nainital and Bhimtal are in Uttarakhand.

## Common exam traps
- Chilika is a lagoon with salty and fresh water, not a freshwater lake.
- Lonar is a salt-water crater lake.`],
  [5,`## Issues (Mains view)
- **Urban lakes** are shrinking because of encroachment and sewage, as in Bengaluru and Hyderabad.
- **Himalayan glacial lakes** can cause sudden **glacial lake outburst floods**.
- **Wetland loss** hurts migratory birds along the Central Asian Flyway, groundwater recharge and fisheries.
- Wise use means involving local communities, controlling pollution at the source, and mapping and legally notifying wetland boundaries.

## Possible Mains questions
- Why are wetlands called the "kidneys of the landscape", and what are the threats to Indian wetlands?
- Discuss the importance of the Ramsar Convention for India.`]
  ];
  LESSONS.states=[
  [0,`## India's states and union territories
India is a country made of many parts. It has **28 states** and **8 union territories**. A state has its own government and chief minister. A union territory is governed more closely by the central government. The capital of India is **New Delhi**.`],
  [0,`## Some big and small ones
- **Rajasthan** is the largest state by area.
- **Uttar Pradesh** has the most people.
- **Goa** is the smallest state by area.
- **Sikkim** has the fewest people among states.
- Every state has a capital city, for example Jaipur for Rajasthan, Lucknow for Uttar Pradesh and Chennai for Tamil Nadu.`],
  [1,`## How states were formed
After independence the states were redrawn mostly on the basis of language. The **States Reorganisation Act, 1956** created 14 states and 6 union territories. Since then new states have been carved out, such as Haryana (1966), Himachal Pradesh (full statehood in 1971), Goa (1987), Chhattisgarh, Uttarakhand and Jharkhand (2000) and Telangana (2014).

## Regions
- **North**: Jammu and Kashmir (UT), Ladakh (UT), Himachal Pradesh, Punjab, Haryana, Uttarakhand, Rajasthan, Uttar Pradesh, Delhi.
- **South**: Andhra Pradesh, Telangana, Karnataka, Kerala, Tamil Nadu.
- **East and North-East**: Bihar, Jharkhand, Odisha, West Bengal and the seven sisters (Assam, Arunachal Pradesh, Manipur, Meghalaya, Mizoram, Nagaland, Tripura) plus Sikkim.`],
  [2,`## Size and population
- By area, the largest states are Rajasthan, Madhya Pradesh, Maharashtra and Uttar Pradesh. Goa, Sikkim and Tripura are among the smallest.
- By population (2011 Census), the most populous are Uttar Pradesh, Maharashtra, Bihar and West Bengal. Among UTs, Delhi is the most populous.
- Among UTs, Lakshadweep is the smallest by area.

## The eight union territories
Andaman and Nicobar Islands, Chandigarh, Dadra and Nagar Haveli and Daman and Diu, Delhi, Jammu and Kashmir, Ladakh, Lakshadweep and Puducherry.`],
  [3,`## The constitutional basis
Article 1 says India is a "Union of States". Parliament can form new states, change boundaries or names by law under **Articles 2 to 4**, and this needs only a simple majority; it is not treated as a constitutional amendment under Article 368. The **Fazal Ali Commission** (1953–55) recommended reorganising states on a linguistic basis. The **Sixth Schedule** gives special autonomous councils to tribal areas in Assam, Meghalaya, Tripura and Mizoram.`],
  [4,`## Facts for State PCS
- Longest coastline among states: Gujarat. Largest population in the north-east: Assam.
- Capital pairs often asked: Dispur (Assam), Itanagar (Arunachal Pradesh), Imphal (Manipur), Shillong (Meghalaya), Aizawl (Mizoram), Kohima (Nagaland), Agartala (Tripura), Gangtok (Sikkim).
- Chandigarh is the shared capital of Punjab and Haryana and is itself a union territory.
- Ladakh became a union territory in 2019 when the state of Jammu and Kashmir was reorganised.

## Common exam traps
- Hyderabad is the capital of Telangana; Amaravati is the declared capital of Andhra Pradesh in its law, though the position has been debated.
- Puducherry is a union territory with its own legislature.`],
  [5,`## Issues (Mains view)
- **Demand for new states** such as Vidarbha and Gorkhaland, and arguments for and against smaller states: better administration versus higher costs and weaker bargaining.
- **Inter-state disputes** over rivers (Cauvery, Krishna-Godavari), boundaries (Belagavi) and capital sharing.
- **Regional imbalance**: some states are far ahead in income and human development, which influences Finance Commission devolution.
- **Federal balance**: asymmetric provisions for the north-east and Article 371.

## Possible Mains questions
- Examine the arguments for and against the creation of smaller states in India.
- Discuss the role of the Inter-State Council and tribunals in settling disputes.`]
  ];
  LESSONS.borders=[
  [0,`## India's neighbours
India shares its land borders with several countries. Water surrounds it on three sides: the **Arabian Sea** in the west, the **Bay of Bengal** in the east and the **Indian Ocean** in the south.

## Neighbours on land
- North: **China**, **Nepal**, **Bhutan**
- West: **Pakistan**; **Afghanistan** touches the part of Jammu and Kashmir that India claims but Pakistan controls
- East: **Myanmar**, **Bangladesh**
- Sri Lanka and the Maldives are island neighbours across the sea.`],
  [1,`## Length and extent
India's land border is about **15,000 km** long. The coastline of the mainland plus islands is about **7,500 km**. The longest border is with **Bangladesh**, and then with China. India's southernmost tip, Indira Point in the Nicobar Islands, lies close to Indonesia.

## Important lines
- The **Radcliffe Line** divides India and Pakistan (1947).
- The **McMahon Line** is the line in the eastern Himalaya that India treats as the boundary with China.
- The **Line of Actual Control (LAC)** is the working line between India and China, and the **Line of Control (LoC)** is the line in Jammu and Kashmir between India and Pakistan.
- The **Durand Line** is the Pakistan–Afghanistan boundary.`],
  [2,`## States along each border
- **Bangladesh**: West Bengal, Assam, Meghalaya, Tripura and Mizoram.
- **China**: Ladakh, Himachal Pradesh, Uttarakhand, Sikkim and Arunachal Pradesh.
- **Pakistan**: Gujarat, Rajasthan, Punjab, and Jammu and Kashmir (UT).
- **Nepal**: Uttarakhand, Uttar Pradesh, Bihar, West Bengal and Sikkim.
- **Bhutan**: Sikkim, West Bengal, Assam and Arunachal Pradesh.
- **Myanmar**: Arunachal Pradesh, Nagaland, Manipur and Mizoram.`],
  [3,`## Maritime boundaries
Under the **UN Convention on the Law of the Sea (UNCLOS)**, a country has a **territorial sea** of up to 12 nautical miles, a **contiguous zone** up to 24 nautical miles and an **Exclusive Economic Zone (EEZ)** up to 200 nautical miles, where it has rights over living and mineral resources. India's boundary with Sri Lanka in the Palk Strait was settled by agreements in 1974 and 1976, and the question of Katchatheevu remains politically debated. The **Palk Strait** lies between India and Sri Lanka, and the **Ten Degree Channel** separates the Andaman Islands from the Nicobar Islands.`],
  [4,`## Facts for State PCS
- Counting Afghanistan, India has seven land neighbours; counting only those with a border India administers, six.
- The **Land Boundary Agreement** with Bangladesh (2015) exchanged enclaves.
- **Sir Creek** is a marshy inlet in the Rann of Kachchh, still disputed with Pakistan.
- The **Siliguri Corridor** ("Chicken's Neck") is a narrow strip in West Bengal linking the north-east with the rest of India.

## Common exam traps
- India's actual land border with Afghanistan is not under Indian control; it lies in the part of Kashmir held by Pakistan. Many lists therefore count six or seven neighbours, so read the question carefully.
- Sri Lanka has no land border with India.`],
  [5,`## Issues (Mains view)
- **Border management**: fencing, floodlighting, integrated check posts and the Border Area Development Programme.
- **Disputes**: the LAC with China, Sir Creek, and the legacy of the Radcliffe Line, with concerns over infiltration and smuggling.
- **Strategic geography**: the Siliguri Corridor, the Andaman and Nicobar chain in the Indian Ocean, and Indian Ocean sea lanes.
- **Neighbourhood diplomacy**: trade, water sharing (Teesta, Ganga treaty) and connectivity projects.

## Possible Mains questions
- Discuss the challenges of managing India's long and varied land borders.
- Why is the Indian Ocean important for India's security and trade?`]
  ];
  LESSONS.passes=[
  [0,`## What is a mountain pass?
A pass is a gap or low place between mountains that lets people, animals and vehicles cross to the other side. Without passes, tall mountains such as the Himalayas would block travel completely. Many passes have roads or tunnels today.`],
  [0,`## Famous passes
- **Khardung La** in Ladakh is one of the highest motorable roads in the world.
- **Nathu La** in Sikkim links India and Tibet (China).
- **Shipki La** is in Himachal Pradesh.
- **Zoji La** links Srinagar and Ladakh.
- **Banihal Pass** links Jammu and the Kashmir Valley; a tunnel now goes under it.
- **Bomdi La** is in Arunachal Pradesh.`],
  [1,`## Passes of the Himalaya
- **Jammu and Kashmir and Ladakh**: Banihal, Zoji La, Khardung La, Pir Panjal, Lanak La.
- **Himachal Pradesh**: Shipki La, Rohtang Pass.
- **Uttarakhand**: Mana, Niti, Lipulekh (also used for the Kailash Mansarovar Yatra).
- **Sikkim**: Nathu La, Jelep La.
- **Arunachal Pradesh**: Bomdi La.

## Western Ghats
- **Thal Ghat**, **Bhor Ghat** and **Pal Ghat** (Palakkad Gap) link the coast and the interior. The **Palakkad Gap** is a wide gap between the Nilgiri Hills and the Anamalai Hills in Kerala.`],
  [2,`## Why passes matter
Passes were used on old trade routes such as the Silk Route and by pilgrims. Today they matter for the army, roads, trade and tourism. Many close in winter because of snow. Nathu La and Shipki La are open for limited border trade with China, and Lipulekh is used for the Kailash Mansarovar Yatra. **Rohtang** has been bypassed by the **Atal Tunnel**, which gives all-weather access to Lahaul and Spiti.`],
  [3,`## Geography behind the passes
Passes occur where rivers cut through ridges, where glaciers have carved notches, or where faults create low saddles. In the Himalaya they often follow river valleys flowing from Tibet, for example the Sutlej through the Shipki La area. The **Palakkad Gap** is a major break in the Western Ghats and allows moisture-bearing winds to reach the interior, which affects rainfall and settlements in the Coimbatore region.`],
  [4,`## Facts for State PCS
- Zoji La connects Kashmir and Ladakh; Banihal connects Jammu with Srinagar.
- Rohtang connects Kullu with Lahaul and Spiti (Himachal Pradesh).
- Nathu La and Jelep La are in Sikkim; Shipki La is in Himachal Pradesh.
- Bhor Ghat links Mumbai and Pune; Thal Ghat links Mumbai and Nashik; Pal Ghat links Kerala and Tamil Nadu.

## Common exam traps
- Shipki La is in Himachal Pradesh, not in Uttarakhand or Sikkim.
- Khardung La is in Ladakh, not in Himachal Pradesh.`],
  [5,`## Issues (Mains view)
- **Strategic value**: passes are routes for the army and also entry points; border roads and tunnels (Atal Tunnel, Zojila Tunnel) improve year-round connectivity.
- **Trade**: border trade through Nathu La and Shipki La and its limited volume, compared with possible benefits.
- **Fragile environment**: roads and tunnels in the Himalaya cause landslides and affect glaciers and ecosystems.
- **Climate change**: more avalanches and unstable slopes make high passes riskier.

## Possible Mains questions
- Examine the strategic and economic importance of Himalayan passes.
- Discuss the environmental concerns of building roads and tunnels in the Himalaya.`]
  ];

  function mdParse(t){
    var out=[],para=[],list=null;
    function flush(){if(para.length){out.push({k:"p",s:para.join(" ")});para=[]}}
    function endList(){if(list){out.push({k:"ul",s:list});list=null}}
    String(t).split(/\r?\n/).forEach(function(raw){
      var ln=raw.replace(/\s+$/,""),m;
      if(/^\s*```/.test(ln)||/^\s*\|/.test(ln)||/^\s*[-=_*]{3,}\s*$/.test(ln)){flush();endList();return}
      if((m=ln.match(/^\s*#{1,2}\s+(.*)$/))){flush();endList();out.push({k:"h2",s:m[1]});return}
      if((m=ln.match(/^\s*#{3,6}\s+(.*)$/))){flush();endList();out.push({k:"h3",s:m[1]});return}
      if((m=ln.match(/^\s*(?:[-*•]|\d+[.)])\s+(.*)$/))){flush();(list=list||[]).push(m[1]);return}
      if(!ln.trim()){flush();endList();return}
      endList();para.push(ln.trim());
    });
    flush();endList();return out;
  }
  function mdInline(el,s){
    String(s).replace(/`/g,"").split(/\*\*(.+?)\*\*/).forEach(function(p,k){
      if(!p)return;
      if(k%2){var b=document.createElement("strong");b.textContent=p.replace(/\*/g,"");el.appendChild(b)}
      else el.appendChild(document.createTextNode(p.replace(/\*/g,"")));
    });
  }
  function mdBlock(b){
    var el;
    if(b.k==="ul"){el=document.createElement("ul");b.s.forEach(function(x){var li=document.createElement("li");mdInline(li,x);el.appendChild(li)})}
    else{el=document.createElement(b.k);mdInline(el,b.s)}
    return el;
  }
  function mdRender(text,box,typing){
    var bl=mdParse(text);
    box.classList.toggle("typing",!!typing);
    bl.forEach(function(b,k){
      var sig=b.k+"|"+(Array.isArray(b.s)?b.s.join("\u0001"):b.s),cur=box.children[k],e;
      if(!cur){e=mdBlock(b);e.dataset.sig=sig;box.appendChild(e)}
      else if(cur.dataset.sig!==sig){e=mdBlock(b);e.dataset.sig=sig;e.style.animation="none";box.replaceChild(e,cur)}
    });
    while(box.children.length>bl.length)box.removeChild(box.lastChild);
  }
  function plainText(){
    function strip(s){return String(s).replace(/\*/g,"")}
    return mdParse(lText).map(function(b){return Array.isArray(b.s)?b.s.map(strip).join(". "):strip(b.s)}).join("\n\n");
  }

  function offlineNotes(){

    if(tp.names)G_RIVERS.forEach(function(r){
      if(tp.names.indexOf(r[0])<0||r[7]>max)return;
      add("The "+r[0]+(r[2]?" rises at "+r[2]:"")+(r[4]?(r[2]?" and":"")+" flows into the "+r[4]:"")+".",
          r[1]+" नदी"+(r[3]?" "+r[3]+" से निकलती है":"")+(r[5]?(r[3]?" और":"")+" "+r[5]+" में गिरती है":"")+"।");
    });

    if(tp.list==="lakes")place(G_LAKES);

  async function generateBatch(){
    var lv=levelObj(lvl);
    var asked=jGet("geobharat-ai-asked",[]);
    var builtin={};poolFor().forEach(function(q){builtin[norm(q.q[0])]=1});
    var topic=cat==="All topics"?"a balanced mix of rivers, mountains, states and cities, and land and climate":cat;
    var prompt=[
      "Write 10 new multiple-choice quiz questions about the geography of India.",
      "Level: "+lv.t[0]+" ("+DIFF[lvl]+").",
      "Topic: "+topic+".",
      "Rules:",
      "- Every question needs exactly 4 options and exactly one correct answer, with plausible wrong options.",
      "- Only use facts you are sure about. Do not ask about disputed borders, current politics or numbers that change often.",
      "- Put the correct answer at a random position among the options.",
      "- Every question must be different from the ones listed under 'Already asked'.",
      "- Give a Hindi version of the question, the options and the fact. Keep place names natural in Hindi.",
      "Reply with only a JSON array of 10 objects, in this shape:",

      "topic is one letter: R rivers, M mountains, S states and cities, C land and climate. a is the index (0 to 3) of the correct option.",

  function confetti(){

    var w=cv.width=window.innerWidth,h=cv.height=window.innerHeight,ctx=cv.getContext("2d");
    var cols=["#e8730c","#138808","#16213e","#ffc21a","#ffffff"],ps=[];

    cancelAnimationFrame(fxRaf);

    (function loop(){
      ctx.clearRect(0,0,w,h);

    btns.forEach(function(b,k){
      b.disabled=true;
      if(q._order[k].ok)b.classList.add("right");
      else if(k===idx)b.classList.add("wrong");
    });
    if(correct){score++;combo++}else combo=0;
    lastKind=correct?"c":idx<0?"t":"w";
    log.push({q:q,ok:correct,timeout:idx<0});
    renderDots();renderCombo();
    $("tnum").className="tnum off";
    if(correct){var sc=$("sc");sc.classList.remove("bump");void sc.offsetWidth;sc.classList.add("bump")}
    if(q._g){var gs=jGet("geobharat-gen-seen",{});gs[q.id]=1;jSet("geobharat-gen-seen",gs);if(q.id.indexOf("gen-")!==0){var sb=getSeen();sb[q.id]=1;setSeen(sb)}}
    else if(q.id.indexOf("ai-")!==0){var seen=getSeen();seen[q.id]=1;setSeen(seen)}
    $("sc").textContent=score;
    var f=$("fact");
    f.textContent=factText();
    f.classList.remove("hidden");
    var n=$("nextBtn");n.textContent=nextLabel();
    n.classList.remove("hidden");n.focus();
  }

  function bestMsg(){
    var x=lvName(lvl)+" · "+catName(cat);
    if(resultBestState==="first")return fmt(u("firstScore"),{x:x});
    if(resultBestState==="new")return fmt(u("newBest"),{x:x});
    return fmt(u("bestFor"),{x:x,b:resultBestVal});
  }

  function renderResultText(){
    var t=qs.length,pct=score/t;
    $("finalOf").textContent=u("ofN")+t;
    var k=pct===1?"100":pct>=.8?"80":pct>=.6?"60":pct>=.4?"40":"0";
    $("rank").textContent=u("r"+k);$("rankMsg").textContent=u("m"+k);
    $("best2").textContent=bestMsg();
    var ul=$("review");ul.innerHTML="";
    log.forEach(function(l){
      var q=l.q;
      var ans=q.o[L][q.a];
      var li=document.createElement("li");li.style.setProperty("--i",ul.children.length);
      var mk=document.createElement("span");mk.className="m "+(l.ok?"ok":"no");mk.textContent=l.ok?"✓":"✗";
      var d=document.createElement("div");d.textContent=q.q[L];
      var sm=document.createElement("small");
      sm.textContent=l.ok?u("answer")+ans:(l.timeout?u("timedOut"):"")+u("correctAns")+ans;
      d.appendChild(sm);li.appendChild(mk);li.appendChild(d);ul.appendChild(li);
    });
  }

  function finish(){
    clearInterval(timerId);
    var t=qs.length,pct=score/t;
    show("result");
    countUp($("finalScore"),score);
    if(pct>=.8)setTimeout(confetti,350);

    var prev=bestFor(lvl,cat==="All topics"?null:cat);
    var all=getScores();
    all.push({lv:lvl,c:cat,s:score,t:t,ts:Date.now()});
    jSet("geobharat-scores",all.slice(-60));
    var now=bestFor(lvl,cat==="All topics"?null:cat);
    if(!prev)resultBestState="first";
    else if(pct>prev.p||(pct===prev.p&&score>prev.s))resultBestState="new";
    else resultBestState="same";
    resultBestVal=bestStr(now);

    /* streak */
    var td=today();
    if(streak.last!==td){
      streak.count=streak.last===yesterday()?(streak.count||0)+1:1;
      streak.last=td;jSet("geobharat-streak",streak);
    }

    renderResultText();renderBoard();updateStartInfo();
    var c=$("ring");c.style.strokeDashoffset="465";
    setTimeout(function(){c.style.strokeDashoffset=String(465*(1-pct))},60);
    window.scrollTo(0,0);
  }

  /* ---------- events ---------- */
  $("startBtn").onclick=start;
  $("nextBtn").onclick=function(){if(i<qs.length-1){i++;render()}else finish()};
  $("quitBtn").onclick=function(){$("quitConfirm").classList.remove("hidden");$("quitYes").focus()};
  $("quitNo").onclick=function(){$("quitConfirm").classList.add("hidden")};
  $("quitYes").onclick=function(){clearInterval(timerId);renderCats();renderBoard();show("start")};
  $("againBtn").onclick=start;
  $("homeBtn").onclick=function(){renderCats();renderBoard();show("start")};
  $("langEn").onclick=function(){setLang(0)};
  $("langHi").onclick=function(){setLang(1)};
  $("langEn2").onclick=function(){setLang(0)};
  $("langHi2").onclick=function(){setLang(1)};

  $("remOn").onchange=function(){
    rem.on=$("remOn").checked;rem.fired="";saveRem();
    if(rem.on)askPerm(function(){renderReminder();checkReminder()});
    else renderReminder();
  };
  $("remTime").onchange=function(){
    rem.time=$("remTime").value||"20:00";rem.fired="";saveRem();renderReminder();checkReminder();
  };
  $("remTest").onclick=function(){
    askPerm(function(){renderReminder();fireReminder(true)});
  };
  $("endlessOn").onchange=function(){
    endless=$("endlessOn").checked;sSet("geobharat-endless",endless?"1":"0");
    if(!endless)pre=null;
    updateStartInfo();
  };
  $("bannerClose").onclick=hideBanner;
  $("bannerPlay").onclick=function(){
    hideBanner();
    if(view==="start"||view==="result"){if(view==="result")show("start");start()}
  };

  document.addEventListener("keydown",function(e){
    if($("quiz").classList.contains("hidden"))return;
    var k=e.key.toLowerCase(),idx="abcd".indexOf(k);
    if(idx<0)idx="1234".indexOf(k);
    if(idx>=0&&!answered&&idx<qs[i]._order.length)answer(idx);
    else if(e.key==="Enter"&&answered&&document.activeElement.tagName!=="BUTTON")$("nextBtn").click();
  });
  document.addEventListener("visibilitychange",function(){if(!document.hidden)checkReminder()});

  /* ---------- keyboard, remote and TV support ---------- */
  var isTV=false;
  try{isTV=/SMART-TV|SmartTV|Tizen|Web0S|WebOS|AppleTV|CrKey|Android TV|BRAVIA|HbbTV|Roku|AFT[A-Z]/i.test(navigator.userAgent)}catch(e){}
  if(isTV)document.body.classList.add("tv");
  function canFocus(el){return el.offsetWidth>0&&el.offsetHeight>0&&!el.disabled}
  document.addEventListener("keydown",function(e){
    var dir={ArrowUp:[0,-1],ArrowDown:[0,1],ArrowLeft:[-1,0],ArrowRight:[1,0]}[e.key];
    if(!dir||e.altKey||e.ctrlKey||e.metaKey)return;
    var t=e.target;
    if(t&&(t.tagName==="TEXTAREA"||t.tagName==="SELECT"||(t.tagName==="INPUT"&&t.type!=="checkbox")))return;
    var els=[].slice.call(document.querySelectorAll("button,input[type=checkbox],summary")).filter(canFocus);
    if(!els.length)return;
    var cur=document.activeElement;
    if(!cur||els.indexOf(cur)<0){els[0].focus();e.preventDefault();return}
    var r=cur.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2,best=null,bs=1e9;
    els.forEach(function(el){
      if(el===cur)return;
      var q=el.getBoundingClientRect(),dx=q.left+q.width/2-cx,dy=q.top+q.height/2-cy;
      var along=dir[0]?dx*dir[0]:dy*dir[1];
      if(along<4)return;
      var across=dir[0]?Math.abs(dy):Math.abs(dx);
      var s=along+across*2.2;
      if(s<bs){bs=s;best=el}
    });
    if(best){best.focus();try{best.scrollIntoView({block:"nearest",behavior:"smooth"})}catch(x){}e.preventDefault()}
  });
  /* full screen button, shown only where the browser allows it */
  var fsBtn=$("fsBtn");
  function fsLabel(){fsBtn.textContent=document.fullscreenElement?(L?"✕ पूर्ण स्क्रीन बंद":"✕ Exit full screen"):(L?"⛶ पूर्ण स्क्रीन":"⛶ Full screen")}
  if(document.documentElement.requestFullscreen&&document.fullscreenEnabled!==false){
    fsBtn.hidden=false;fsLabel();
    fsBtn.onclick=function(){
      try{
        if(document.fullscreenElement)document.exitFullscreen();
        else{var p=document.documentElement.requestFullscreen();if(p&&p.catch)p.catch(function(){})}
      }catch(x){}
    };
    document.addEventListener("fullscreenchange",fsLabel);
  }
  function keysHint(){
    $("keysHint").innerHTML=L
      ?"कीबोर्ड: <kbd>A</kbd>–<kbd>D</kbd> या <kbd>1</kbd>–<kbd>4</kbd> से उत्तर दें, <kbd>Enter</kbd> से आगे, <kbd>←</kbd><kbd>↑</kbd><kbd>↓</kbd><kbd>→</kbd> से चुनें।"
      :"Keyboard: <kbd>A</kbd>–<kbd>D</kbd> or <kbd>1</kbd>–<kbd>4</kbd> to answer, <kbd>Enter</kbd> for next, arrow keys to move around. Works with a TV remote.";
  }

  /* ---------- boot ---------- */
  var savedLv=sGet("geobharat-level");
  if(savedLv&&RAW[savedLv])lvl=savedLv;
  rem=jGet("geobharat-reminder",rem);
  if(!rem||typeof rem!=="object")rem={on:false,time:"20:00",fired:""};
  streak=jGet("geobharat-streak",streak);
  var saved=sGet("geobharat-lang");
  if(saved!==null)L=saved==="1"?1:0;
  else{try{if((navigator.language||"").toLowerCase().indexOf("hi")===0)L=1}catch(e){}}
  endless=sGet("geobharat-endless")!=="0";
  applyStatic();
  if(isTV){try{$("startBtn").focus()}catch(e){}}
  checkReminder();
  try{if(!NLN&&"serviceWorker" in navigator&&/^https?:$/.test(location.protocol))navigator.serviceWorker.register("sw.js").catch(function(){})}catch(e){}
  setInterval(checkReminder,15000);
  (async function(){
    try{
      if(window.claude&&typeof window.claude.use==="function")sample=await window.claude.use("sample");
    }catch(e){sample=null}
    updateEndlessUI();
    applyLearnStatic();
  })();
})();
</script>
</body>
</html>
