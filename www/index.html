<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#16213e">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<title>GeoBharat</title>
<style>
:root{
  --saffron:#e8730c;
  --saffron-d:#b85606;
  --green:#138808;
  --green-l:#e3f4e1;
  --navy:#16213e;
  --ink:#1f2433;
  --muted:#667085;
  --cream:#fff8ee;
  --card:#ffffff;
  --red:#c62828;
  --red-l:#fde8e8;
  --line:#ecdfca;
}
*{box-sizing:border-box}
html,body{margin:0}
body{
  font-family:Georgia,"Times New Roman","Noto Serif Devanagari","Mangal",serif;
  color:var(--ink);
  background:
    radial-gradient(circle at 10% 0%,#ffe2bd 0,transparent 40%),
    radial-gradient(circle at 100% 100%,#d6efd2 0,transparent 40%),
    var(--cream);
  min-height:100vh;
  display:flex;align-items:center;justify-content:center;
  padding:16px;
}
button{font:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--navy);outline-offset:3px;border-radius:8px}
.app{
  width:100%;max-width:660px;background:var(--card);
  border-radius:22px;box-shadow:0 20px 50px rgba(22,33,62,.15);
  overflow:hidden;border:1px solid var(--line);
}
.stripe{height:8px;background:linear-gradient(90deg,var(--saffron) 33%,#fff 33% 66%,var(--green) 66%)}
.pad{padding:28px}
h1{font-size:2rem;line-height:1.15;margin:0 0 8px;color:var(--navy)}
h2{font-size:1.3rem;line-height:1.35;margin:0 0 20px;color:var(--navy)}
p{line-height:1.55;margin:0 0 14px}
.eyebrow{font-family:system-ui,sans-serif;text-transform:uppercase;letter-spacing:.14em;font-size:.72rem;color:var(--saffron-d);font-weight:700;margin-bottom:8px}
html[lang="hi"] .eyebrow{letter-spacing:.03em;text-transform:none;font-size:.85rem}
.chakra{width:84px;height:84px;margin-bottom:14px}
.topbar{display:flex;justify-content:flex-end;margin-bottom:6px}
.lang{display:inline-flex;border:2px solid var(--navy);border-radius:99px;overflow:hidden;font-family:system-ui,sans-serif}
.lang button{border:0;background:#fff;color:var(--navy);padding:6px 14px;font-size:.85rem;font-weight:700}
.lang button[aria-pressed="true"]{background:var(--navy);color:#fff}
.btn{
  font-family:system-ui,sans-serif;font-weight:700;font-size:1rem;
  border:0;border-radius:12px;padding:14px 22px;
  background:var(--saffron);color:#fff;
  box-shadow:0 4px 0 var(--saffron-d);transition:transform .08s;
}
.btn:hover{background:#f07f1a}
.btn:active{transform:translateY(2px);box-shadow:0 2px 0 var(--saffron-d)}
.btn.ghost{background:#fff;color:var(--navy);box-shadow:none;border:2px solid var(--navy)}
.btn.ghost:hover{background:#f1f3f9}
.btn.small{padding:9px 14px;font-size:.85rem}
.btn:disabled{opacity:.5;cursor:not-allowed}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.hud{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;font-family:system-ui,sans-serif;font-size:.85rem;color:var(--muted);margin-bottom:10px}
.hud b{color:var(--navy)}
.bar{height:8px;background:#f1e8d8;border-radius:99px;overflow:hidden;margin-bottom:22px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--saffron),var(--green));width:0;transition:width .3s}
.timer{height:4px;background:#f1e8d8;border-radius:99px;overflow:hidden;margin:-12px 0 20px}
.timer i{display:block;height:100%;background:var(--navy);width:100%}
.opts{display:grid;gap:10px;margin:0;padding:0;list-style:none}
.opt{
  width:100%;text-align:left;font-family:system-ui,sans-serif;font-size:1rem;
  padding:14px 16px;border-radius:12px;border:2px solid var(--line);background:#fff;color:var(--ink);
  display:flex;gap:12px;align-items:center;transition:border-color .15s,background .15s;
}
.opt:hover:not(:disabled){border-color:var(--saffron);background:#fff6ea}
.opt .k{flex:none;width:28px;height:28px;border-radius:8px;background:var(--cream);border:1px solid var(--line);display:grid;place-items:center;font-weight:700;font-size:.8rem;color:var(--navy)}
.opt.right{border-color:var(--green);background:var(--green-l)}
.opt.wrong{border-color:var(--red);background:var(--red-l)}
.opt:disabled{cursor:default}
.fact{
  font-family:system-ui,sans-serif;font-size:.92rem;line-height:1.5;
  margin-top:16px;padding:12px 14px;border-radius:12px;background:#f4f6fb;border-left:4px solid var(--navy);
}
.fact.note{margin:0 0 16px;background:#fff6ea;border-left-color:var(--saffron)}
.score-ring{position:relative;width:170px;height:170px;margin:6px auto 12px}
.score-ring svg{transform:rotate(-90deg)}
.score-ring .num{position:absolute;inset:0;display:grid;place-items:center;text-align:center;font-size:2.4rem;font-weight:700;color:var(--navy);line-height:1}
.score-ring .num small{display:block;font-family:system-ui,sans-serif;font-size:.8rem;font-weight:400;color:var(--muted);margin-top:4px}
.center{text-align:center}
.review{margin:20px 0 0;padding:0;list-style:none;display:grid;gap:8px;font-family:system-ui,sans-serif;font-size:.9rem}
.review li{display:flex;gap:10px;padding:10px 12px;border-radius:10px;background:#faf6ee;align-items:flex-start}
.review .m{flex:none;font-weight:700}
.review .ok{color:var(--green)} .review .no{color:var(--red)}
.review small{display:block;color:var(--muted);margin-top:2px}
.best{font-family:system-ui,sans-serif;color:var(--muted);font-size:.9rem;margin:6px 0 14px}
.cats{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 10px}
.cat{font-family:system-ui,sans-serif;font-size:.85rem;padding:8px 14px;border-radius:99px;border:2px solid var(--line);background:#fff;color:var(--navy)}
.cat[aria-pressed="true"]{background:var(--navy);color:#fff;border-color:var(--navy)}
.lvdesc{font-family:system-ui,sans-serif;font-size:.88rem;color:var(--muted);margin:0 0 16px}
.hidden{display:none!important}

.banner{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;background:var(--navy);color:#fff;padding:12px 18px;font-family:system-ui,sans-serif;font-size:.92rem}
.banner .btn{padding:8px 12px;font-size:.85rem;box-shadow:none}
.banner .btn.ghost{background:transparent;color:#fff;border-color:#fff}
.banner .btn.ghost:hover{background:rgba(255,255,255,.12)}
.box{border:2px solid var(--line);border-radius:14px;padding:14px;margin-top:22px;font-family:system-ui,sans-serif}
.box .eyebrow{margin-bottom:10px}
.mini{font-size:.82rem;color:var(--muted);margin-top:8px;line-height:1.45}
.check{display:flex;gap:10px;align-items:center;font-size:.95rem;margin-bottom:10px}
.check input{width:20px;height:20px;accent-color:var(--green)}
input[type=time]{font:inherit;padding:8px 10px;border:2px solid var(--line);border-radius:10px;color:var(--ink);background:#fff}
details.box summary{cursor:pointer;font-weight:700;color:var(--navy);list-style:none;display:flex;justify-content:space-between;gap:10px}
details.box summary::-webkit-details-marker{display:none}
details.box summary::after{content:"+";font-weight:700;color:var(--saffron-d)}
details[open].box summary::after{content:"\2013"}
.tbl{width:100%;border-collapse:collapse;margin-top:12px;font-size:.88rem}
.tbl th,.tbl td{text-align:left;padding:7px 6px;border-bottom:1px solid var(--line)}
.tbl th{font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
html[lang="hi"] .tbl th{text-transform:none;letter-spacing:0;font-size:.8rem}
.tbl td.n{font-variant-numeric:tabular-nums;white-space:nowrap}
.streak{font-weight:700;color:var(--saffron-d);margin-top:10px;font-size:.95rem}
@media(max-width:480px){.pad{padding:20px}h1{font-size:1.65rem}}

/* ---------- motion and polish ---------- */
@keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pop{0%{opacity:0;transform:translateY(10px) scale(.97)}100%{opacity:1;transform:none}}
@keyframes slide{from{opacity:0;transform:translateX(24px)}to{opacity:1;transform:none}}
@keyframes shake{0%,100%{transform:none}20%{transform:translateX(-7px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(3px)}}
@keyframes ping{0%{box-shadow:0 0 0 0 rgba(19,136,8,.45)}100%{box-shadow:0 0 0 14px rgba(19,136,8,0)}}
@keyframes bump{0%{transform:scale(1)}40%{transform:scale(1.5)}100%{transform:scale(1)}}
@keyframes glow{0%,100%{opacity:1}50%{opacity:.55}}
.app{animation:rise .5s ease both;position:relative}
.stripe{background-size:200% 100%;animation:flow 8s linear infinite}
@keyframes flow{to{background-position:200% 0}}
.chakra{animation:spin 48s linear infinite}
#start h1{font-size:2.5rem;letter-spacing:-.02em;background:linear-gradient(90deg,var(--saffron),var(--navy) 55%,var(--green));-webkit-background-clip:text;background-clip:text;color:transparent;width:fit-content}
.btn{transition:transform .12s,box-shadow .12s,background .15s}
.btn:hover:not(:disabled){transform:translateY(-2px);box-shadow:0 6px 0 var(--saffron-d)}
.btn.ghost:hover:not(:disabled){box-shadow:none;transform:translateY(-1px)}
#startBtn{width:100%;font-size:1.1rem;padding:16px 22px;margin-top:4px}
#startBtn:not(:disabled){animation:ping 2.4s ease-out infinite;box-shadow:0 4px 0 var(--saffron-d)}

.lvgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:6px 0 10px}
@media(max-width:480px){.lvgrid{grid-template-columns:repeat(2,minmax(0,1fr))}}
.lvcard{font-family:system-ui,sans-serif;text-align:left;padding:10px 12px;border-radius:14px;border:2px solid var(--line);background:#fff;color:var(--navy);display:flex;flex-direction:column;gap:7px;transition:transform .15s,border-color .15s,background .15s,box-shadow .15s;animation:pop .4s both;animation-delay:calc(var(--i)*45ms)}
.lvcard:hover{transform:translateY(-3px);border-color:var(--saffron);box-shadow:0 8px 18px rgba(22,33,62,.12)}
.lvcard b{font-size:.92rem;line-height:1.2}
.lvcard[aria-pressed="true"]{background:var(--navy);border-color:var(--navy);color:#fff;transform:translateY(-3px);box-shadow:0 10px 22px rgba(22,33,62,.3)}
.ddots{display:flex;gap:4px}
.ddots i{width:7px;height:7px;border-radius:50%;background:#e6dcc8}
.ddots i.on{background:var(--saffron)}
.lvcard[aria-pressed="true"] .ddots i{background:rgba(255,255,255,.3)}
.lvcard[aria-pressed="true"] .ddots i.on{background:#ffb35c}
.cat{transition:transform .12s,background .15s,border-color .15s}
.cat:hover{transform:translateY(-2px);border-color:var(--saffron)}
.cat[aria-pressed="true"]{transform:scale(1.04)}
.lvdesc{min-height:2.6em}
#fresh,#best{display:inline-block;background:#f4f6fb;border-radius:99px;padding:5px 12px;margin:0 6px 8px 0;font-size:.82rem}

.hudr{display:flex;align-items:center;gap:12px}
.tnum{min-width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:var(--navy);color:#fff;font-weight:700;font-size:.95rem;font-variant-numeric:tabular-nums;transition:background .3s}
.tnum.warn{background:#d98200}
.tnum.crit{background:var(--red);animation:glow .5s linear infinite}
.tnum.off{opacity:.35}
.combo{background:#fff1dc;color:var(--saffron-d);border:1px solid #ffd9a3;border-radius:99px;padding:3px 10px;font-weight:700;font-size:.8rem;animation:pop .3s both}
#sc.bump{display:inline-block;animation:bump .4s}
.dots{display:flex;gap:6px;margin:0 0 14px}
.dots i{flex:1;height:8px;border-radius:99px;background:#efe6d4;transition:background .3s,transform .3s}
.dots i.cur{background:var(--navy);transform:scaleY(1.35)}
.dots i.ok{background:var(--green)}
.dots i.no{background:var(--red)}
.dots i.to{background:#d98200}
.timer{height:8px;margin:-4px 0 20px}
.timer i{background:linear-gradient(90deg,var(--green),#e0a100 60%,var(--red))}
#qtext{animation:slide .35s both}
.opt{animation:pop .35s both;animation-delay:calc(var(--i)*70ms);transition:transform .12s,border-color .15s,background .15s,box-shadow .15s}
.opt:hover:not(:disabled){transform:translateX(4px);box-shadow:0 4px 12px rgba(232,115,12,.15)}
.opt.right{animation:ping .7s ease-out}
.opt.right .k{background:var(--green);color:#fff;border-color:var(--green)}
.opt.wrong{animation:shake .45s}
.opt.wrong .k{background:var(--red);color:#fff;border-color:var(--red)}
.opt:disabled:not(.right):not(.wrong){opacity:.55}
.fact{animation:pop .3s both}
.score-ring svg circle#ring{filter:drop-shadow(0 0 6px rgba(19,136,8,.35))}
#rank{animation:pop .5s .2s both}
.review li{animation:pop .3s both;animation-delay:calc(var(--i)*40ms)}
.box{transition:border-color .2s}
.box:hover{border-color:var(--saffron)}
/* ---------- tabs ---------- */
.tabs{display:flex;gap:6px;padding:12px 28px 0;font-family:system-ui,sans-serif}
.tabs button{border:0;background:transparent;color:var(--muted);font-weight:700;font-size:.95rem;padding:9px 18px;border-radius:99px;position:relative;transition:color .2s,background .2s,transform .15s}
.tabs button:hover{color:var(--navy);transform:translateY(-1px)}
.tabs button[aria-pressed="true"]{background:var(--navy);color:#fff;box-shadow:0 4px 12px rgba(22,33,62,.25)}
.tabs.off{display:none}

/* ---------- learn ---------- */
.lh1{font-size:2rem;margin:0 0 10px;color:var(--navy);width:fit-content;max-width:100%;overflow-wrap:anywhere}
#learn .lh1#lTitle{background:linear-gradient(90deg,var(--saffron),var(--navy) 55%,var(--green));-webkit-background-clip:text;background-clip:text;color:transparent}
.tgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin:6px 0 14px}
.tcard{font-family:system-ui,sans-serif;text-align:left;border:2px solid var(--line);background:#fff;color:var(--navy);border-radius:16px;padding:14px;display:flex;gap:12px;align-items:center;position:relative;overflow:hidden;transition:transform .18s,border-color .18s,box-shadow .18s;animation:pop .4s both;animation-delay:calc(var(--i)*40ms)}
.tcard::before{content:"";position:absolute;inset:0;background:linear-gradient(120deg,transparent 30%,rgba(232,115,12,.14),transparent 70%);transform:translateX(-100%);transition:transform .5s}
.tcard:hover{transform:translateY(-4px) rotate(-.4deg);border-color:var(--saffron);box-shadow:0 12px 24px rgba(22,33,62,.14)}
.tcard:hover::before{transform:translateX(100%)}
.tcard:active{transform:scale(.98)}
.tcard .ic{flex:none;width:44px;height:44px;border-radius:14px;background:var(--cream);display:grid;place-items:center;font-size:1.5rem;transition:transform .3s}
.tcard:hover .ic{transform:scale(1.15) rotate(-8deg)}
.tcard b{font-size:.95rem;line-height:1.25;position:relative}
.tcard:focus-visible{outline:4px solid var(--navy);outline-offset:3px}
.custom{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
.custom input{flex:1;min-width:180px;font:inherit;font-family:system-ui,sans-serif;padding:12px 14px;border:2px solid var(--line);border-radius:12px;background:#fff;color:var(--ink)}
.custom input:focus{outline:none;border-color:var(--saffron);box-shadow:0 0 0 4px rgba(232,115,12,.15)}
.rbar{position:fixed;top:0;left:0;right:0;z-index:60;height:4px;background:rgba(241,232,216,.8)}
.lang2 button{padding:5px 11px;font-size:.78rem}
#rStatus[data-kind="bad"]{color:var(--red)}
#rStatus[data-kind="ok"]{color:var(--green)}
.rbar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--saffron),var(--green));transition:width .15s}
.rhead{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.grow{flex:1}
.lesson{font-family:Georgia,"Noto Serif Devanagari","Mangal",serif;font-size:1.05rem;line-height:1.75;max-width:70ch}
.lesson>*{animation:pop .45s both}
.lesson h2{font-size:1.35rem;margin:26px 0 8px;color:var(--navy);padding-left:12px;border-left:5px solid var(--saffron);line-height:1.3}
.lesson h3{font-size:1.1rem;margin:18px 0 6px;color:var(--saffron-d);font-family:system-ui,sans-serif}
.lesson p{margin:0 0 14px}
.lesson ul{margin:0 0 16px;padding:0;list-style:none;display:grid;gap:8px}
.lesson li{position:relative;padding:10px 12px 10px 38px;background:#faf6ee;border-radius:12px;font-size:1rem;line-height:1.6}
.lesson li::before{content:"";position:absolute;left:14px;top:1.15em;width:10px;height:10px;border-radius:50%;background:linear-gradient(135deg,var(--saffron),var(--green))}
.lesson strong{color:var(--navy);background:linear-gradient(transparent 62%,rgba(255,194,26,.45) 62%)}
.lesson.typing>:last-child::after{content:"";display:inline-block;width:8px;height:1.05em;margin-left:3px;vertical-align:-.15em;background:var(--saffron);animation:glow .8s steps(2) infinite}
.skel{display:grid;gap:12px;margin:18px 0;max-width:70ch}
.skel i{display:block;height:14px;border-radius:8px;background:linear-gradient(90deg,#f1e8d8 25%,#fff6ea 50%,#f1e8d8 75%);background-size:200% 100%;animation:shim 1.2s linear infinite}
.skel i:nth-child(2){width:92%}.skel i:nth-child(3){width:78%}.skel i:nth-child(4){width:96%}.skel i:nth-child(5){width:55%}
@keyframes shim{to{background-position:-200% 0}}
.rfoot{margin-top:22px}
.mini{font-family:system-ui,sans-serif;font-size:.82rem;color:var(--muted);margin-top:8px;line-height:1.45}
.tabs+#start{animation:pop .3s both}
@media(min-width:900px){
  .tabs{padding:16px 40px 0}
  .tgrid{grid-template-columns:repeat(3,minmax(0,1fr))}
  .lh1{font-size:2.6rem}
  .lesson{font-size:1.15rem}
  .lesson li{font-size:1.05rem}
}
.topbar{gap:10px;align-items:center}
.keys{display:none;font-family:system-ui,sans-serif;font-size:.8rem;color:var(--muted);margin-top:12px}
.keys kbd{font:600 .75rem ui-monospace,Menlo,Consolas,monospace;background:var(--cream);border:1px solid var(--line);border-bottom-width:2px;border-radius:6px;padding:1px 6px;color:var(--navy)}
.opt:focus-visible,.lvcard:focus-visible,.cat:focus-visible{outline:4px solid var(--navy);outline-offset:3px;background:#fff6ea;border-color:var(--saffron)}
.lvcard[aria-pressed="true"]:focus-visible{background:var(--navy)}

/* laptop and desktop: two columns, wider quiz, options in a grid */
@media(min-width:900px){
  body{padding:28px 36px}
  .app{max-width:1060px}
  .pad{padding:36px 40px}
  #start{display:flex;gap:44px;align-items:flex-start}
  #start .mainc{flex:1.3;min-width:0}
  #start .side{flex:1;min-width:0;position:sticky;top:20px}
  #start .side .box:first-child{margin-top:0}
  #start .chakra{width:96px;height:96px}
  #start h1{font-size:3rem}
  .keys{display:block}
  h2{font-size:1.7rem;margin-bottom:26px}
  .opts{grid-template-columns:1fr 1fr;gap:14px}
  .opts li{display:flex}
  .opt{flex:1;padding:18px 18px;font-size:1.05rem}
  .opt .k{width:32px;height:32px}
  .fact{font-size:1rem}
  #result{display:grid;grid-template-columns:minmax(0,.85fr) minmax(0,1.15fr);column-gap:44px;align-items:start}
  #result .center{grid-column:1;grid-row:1 / span 2;position:sticky;top:20px}
  #result #tReview{grid-column:2;grid-row:1;margin-top:0!important}
  #result .review{grid-column:2;grid-row:2;margin-top:6px}
}
/* big monitors and TVs: scale the whole app up so it reads from the sofa */
@media(min-width:1440px){.app{zoom:1.2}}
@media(min-width:1920px){.app{zoom:1.5}}
@media(min-width:2560px){.app{zoom:2}}
@media(min-width:3400px){.app{zoom:2.8}}
body.tv{cursor:none}
body.tv *:focus-visible{outline-width:5px}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<canvas id="fx" aria-hidden="true" style="position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:50"></canvas>
<main class="app">
  <div class="stripe"></div>
  <div class="banner hidden" id="banner" role="alert">
    <span id="bannerText"></span>
    <span class="row" style="gap:8px">
      <button class="btn small" id="bannerPlay"></button>
      <button class="btn ghost small" id="bannerClose"></button>
    </span>
  </div>

  <nav class="tabs" id="tabs" aria-label="Sections">
    <button type="button" id="tabQuiz" aria-pressed="true"></button>
    <button type="button" id="tabLearn" aria-pressed="false"></button>
    <span class="grow"></span>

    ["R","Which river is known as the 'Sorrow of Bihar'?","कौन-सी नदी 'बिहार का शोक' कहलाती है?",["Son","Gandak","Kosi","Ghaghara"],["सोन","गंडक","कोसी","घाघरा"],2,"The Kosi often shifts its course and floods north Bihar.","कोसी अक्सर अपना मार्ग बदलती है और उत्तर बिहार में बाढ़ लाती है।"],
    ["R","The Sundarbans delta is formed by the Brahmaputra and which other river?","सुंदरबन डेल्टा ब्रह्मपुत्र और किस अन्य नदी से बनता है?",["Ganga","Mahanadi","Godavari","Krishna"],["गंगा","महानदी","गोदावरी","कृष्णा"],0,"Together the Ganga and the Brahmaputra build the largest delta in the world.","गंगा और ब्रह्मपुत्र मिलकर दुनिया का सबसे बड़ा डेल्टा बनाती हैं।"],
    ["R","Which place in Madhya Pradesh is the source of the Narmada?","मध्य प्रदेश का कौन-सा स्थान नर्मदा का उद्गम है?",["Amarkantak","Pachmarhi","Mhow","Multai"],["अमरकंटक","पचमढ़ी","महू","मुलताई"],0,"The Narmada flows west for about 1,312 km through a rift valley. The Tapi, by contrast, rises at Multai.","नर्मदा भ्रंश घाटी से होकर लगभग 1,312 किमी पश्चिम की ओर बहती है। तापी मुलताई से निकलती है।"],
    ["R","Which river flows through Srinagar?","श्रीनगर से होकर कौन-सी नदी बहती है?",["Chenab","Jhelum","Ravi","Beas"],["चिनाब","झेलम","रावी","ब्यास"],1,"The Jhelum flows through Srinagar and the Wular Lake in the Kashmir Valley.","झेलम कश्मीर घाटी में श्रीनगर और वूलर झील से होकर बहती है।"],
    ["M","Which pass connects Srinagar and Leh?","कौन-सा दर्रा श्रीनगर और लेह को जोड़ता है?",["Zoji La","Nathu La","Banihal","Bomdila"],["ज़ोजिला","नाथू ला","बनिहाल","बोमडिला"],0,"Zoji La, at about 3,500 m, is the gateway between the Kashmir Valley and Ladakh.","लगभग 3,500 मी ऊँचा ज़ोजिला कश्मीर घाटी और लद्दाख का प्रवेशद्वार है।"],
    ["M","Which is the highest peak of peninsular India?","प्रायद्वीपीय भारत की सबसे ऊँची चोटी कौन-सी है?",["Doddabetta","Anamudi","Mahendragiri","Guru Shikhar"],["दोदाबेटा","अनामुडी","महेंद्रगिरि","गुरु शिखर"],1,"Anamudi (2,695 m) in Kerala is part of the Western Ghats.","केरल की अनामुडी (2,695 मी) पश्चिमी घाट का हिस्सा है।"],
    ["M","Which is the outermost, southernmost range of the Himalayas?","हिमालय की सबसे बाहरी, दक्षिणतम श्रेणी कौन-सी है?",["Himadri","Himachal","Shiwalik","Karakoram"],["हिमाद्रि","हिमाचल","शिवालिक","काराकोरम"],2,"The Shiwaliks are the youngest and lowest of the three Himalayan ranges.","शिवालिक हिमालय की तीनों श्रेणियों में सबसे युवा और सबसे नीची है।"],
    ["M","Doddabetta is the highest peak of which hills?","दोदाबेटा किन पहाड़ियों की सबसे ऊँची चोटी है?",["Nilgiri","Aravalli","Satpura","Cardamom"],["नीलगिरि","अरावली","सतपुड़ा","इलायची"],0,"Doddabetta (2,637 m) stands near Udhagamandalam (Ooty) in Tamil Nadu.","दोदाबेटा (2,637 मी) तमिलनाडु में उदगमंडलम (ऊटी) के पास है।"],
    ["M","Guru Shikhar, the highest peak of the Aravallis, is in which state?","अरावली की सबसे ऊँची चोटी गुरु शिखर किस राज्य में है?",["Gujarat","Rajasthan","Haryana","Madhya Pradesh"],["गुजरात","राजस्थान","हरियाणा","मध्य प्रदेश"],1,"Guru Shikhar (1,722 m) is near Mount Abu in Rajasthan.","गुरु शिखर (1,722 मी) राजस्थान में माउंट आबू के पास है।"],
    ["S","Which city is the capital of Gujarat?","गुजरात की राजधानी कौन-सा शहर है?",["Ahmedabad","Surat","Gandhinagar","Vadodara"],["अहमदाबाद","सूरत","गांधीनगर","वडोदरा"],2,"Gandhinagar is a planned city on the Sabarmati river, named after Mahatma Gandhi.","गांधीनगर साबरमती नदी पर बसा नियोजित शहर है, जिसका नाम महात्मा गांधी पर रखा गया।"],
    ["S","How many states does India have today?","आज भारत में कितने राज्य हैं?",["25","28","29","30"],["25","28","29","30"],1,"India has 28 states and 8 Union Territories, after Dadra and Nagar Haveli merged with Daman and Diu in 2020.","भारत में 28 राज्य और 8 केंद्रशासित प्रदेश हैं; 2020 में दादरा और नगर हवेली का दमन और दीव से विलय हुआ।"],
    ["S","Which state lies to the east of Bihar?","बिहार के पूर्व में कौन-सा राज्य है?",["West Bengal","Uttar Pradesh","Madhya Pradesh","Rajasthan"],["पश्चिम बंगाल","उत्तर प्रदेश","मध्य प्रदेश","राजस्थान"],0,"Bihar is bordered by Uttar Pradesh to the west, West Bengal to the east and Jharkhand to the south.","बिहार के पश्चिम में उत्तर प्रदेश, पूर्व में पश्चिम बंगाल और दक्षिण में झारखंड है।"],
    ["S","What is the capital of Arunachal Pradesh?","अरुणाचल प्रदेश की राजधानी कौन-सी है?",["Itanagar","Dispur","Kohima","Imphal"],["ईटानगर","दिसपुर","कोहिमा","इंफाल"],0,"Itanagar is named after the Ita Fort, a 14th–15th century brick fort.","ईटानगर का नाम ईटा क़िले पर पड़ा, जो 14वीं–15वीं सदी का ईंटों का क़िला है।"],
    ["S","Which city is called the 'Silicon Valley of India'?","किस शहर को 'भारत की सिलिकॉन वैली' कहा जाता है?",["Hyderabad","Chennai","Bengaluru","Pune"],["हैदराबाद","चेन्नई","बेंगलुरु","पुणे"],2,"Bengaluru, in Karnataka, is India's main information technology hub.","कर्नाटक का बेंगलुरु भारत का प्रमुख सूचना प्रौद्योगिकी केंद्र है।"],
    ["C","Which soil, deposited by rivers, is the most widespread and fertile in the northern plains?","नदियों द्वारा जमा की गई कौन-सी मिट्टी उत्तरी मैदानों में सबसे व्यापक और उपजाऊ है?",["Black soil","Red soil","Alluvial soil","Laterite soil"],["काली मिट्टी","लाल मिट्टी","जलोढ़ मिट्टी","लैटेराइट मिट्टी"],2,"Alluvial soil suits wheat, rice and sugarcane.","जलोढ़ मिट्टी गेहूँ, चावल और गन्ने के लिए उपयुक्त है।"],
    ["C","The Tropic of Cancer passes through how many Indian states?","कर्क रेखा भारत के कितने राज्यों से होकर गुज़रती है?",["Six","Eight","Ten","Twelve"],["छह","आठ","दस","बारह"],1,"It crosses Gujarat, Rajasthan, Madhya Pradesh, Chhattisgarh, Jharkhand, West Bengal, Tripura and Mizoram.","यह गुजरात, राजस्थान, मध्य प्रदेश, छत्तीसगढ़, झारखंड, पश्चिम बंगाल, त्रिपुरा और मिज़ोरम से गुज़रती है।"],
    ["C","Which wind brings winter rain to Tamil Nadu's coast?","कौन-सी पवन तमिलनाडु के तट पर सर्दियों की वर्षा लाती है?",["Southwest monsoon","Northeast (retreating) monsoon","Western disturbance","Loo"],["दक्षिण-पश्चिम मानसून","उत्तर-पूर्वी (लौटता) मानसून","पश्चिमी विक्षोभ","लू"],1,"The retreating monsoon picks up moisture over the Bay of Bengal and rains on the Coromandel Coast in October–December.","लौटता मानसून बंगाल की खाड़ी से नमी लेकर अक्टूबर–दिसंबर में कोरोमंडल तट पर वर्षा करता है।"],
    ["C","Which is the largest brackish water lagoon in India?","भारत की सबसे बड़ी खारे पानी की लैगून कौन-सी है?",["Chilika","Pulicat","Vembanad","Wular"],["चिल्का","पुलिकट","वेम्बनाड","वूलर"],0,"Chilika Lake in Odisha is famous for migratory birds and Irrawaddy dolphins.","ओडिशा की चिल्का झील प्रवासी पक्षियों और इरावदी डॉल्फ़िन के लिए प्रसिद्ध है।"],
    ["C","Which is the southernmost point of India, including its islands?","द्वीपों सहित भारत का सबसे दक्षिणी बिंदु कौन-सा है?",["Kanniyakumari","Indira Point","Rameswaram","Port Blair"],["कन्याकुमारी","इंदिरा पॉइंट","रामेश्वरम","पोर्ट ब्लेयर"],1,"Indira Point on Great Nicobar is the southernmost point. Kanniyakumari is the tip of the mainland.","ग्रेट निकोबार का इंदिरा पॉइंट सबसे दक्षिणी बिंदु है। कन्याकुमारी मुख्य भूमि का छोर है।"]
  ],
  s1112:[
    ["R","In which Union Territory does the Indus first enter India?","सिंधु नदी भारत में सबसे पहले किस केंद्रशासित प्रदेश में प्रवेश करती है?",["Ladakh","Himachal Pradesh","Punjab","Delhi"],["लद्दाख","हिमाचल प्रदेश","पंजाब","दिल्ली"],0,"The Indus rises near Mansarovar in Tibet and enters India in Ladakh.","सिंधु तिब्बत में मानसरोवर के पास से निकलती है और लद्दाख में भारत में प्रवेश करती है।"],
    ["R","Which is the longest tributary of the Ganga?","गंगा की सबसे लंबी सहायक नदी कौन-सी है?",["Yamuna","Ghaghara","Gandak","Son"],["यमुना","घाघरा","गंडक","सोन"],0,"The Yamuna is about 1,376 km long. The Ghaghara carries the largest volume of water.","यमुना लगभग 1,376 किमी लंबी है। सबसे अधिक जल घाघरा लाती है।"],
    ["R","The Dhuandhar Falls near Jabalpur are on which river?","जबलपुर के पास धुआँधार जलप्रपात किस नदी पर है?",["Chambal","Narmada","Son","Betwa"],["चंबल","नर्मदा","सोन","बेतवा"],1,"The Narmada plunges over marble rocks at Bhedaghat, throwing up a cloud of spray.","नर्मदा भेड़ाघाट में संगमरमर की चट्टानों से गिरती है और फुहारों का बादल बनाती है।"],
    ["R","Which west-flowing river joins the Arabian Sea near Surat?","पश्चिम की ओर बहने वाली कौन-सी नदी सूरत के पास अरब सागर में मिलती है?",["Mahi","Tapi","Sabarmati","Luni"],["माही","तापी","साबरमती","लूनी"],1,"The Tapi rises at Multai in Madhya Pradesh and forms an estuary in the Gulf of Khambhat.","तापी मध्य प्रदेश के मुलताई से निकलती है और खंभात की खाड़ी में ज्वारनदमुख बनाती है।"],
    ["R","The Nagarjuna Sagar Dam is built on which river?","नागार्जुन सागर बाँध किस नदी पर बना है?",["Godavari","Krishna","Tungabhadra","Mahanadi"],["गोदावरी","कृष्णा","तुंगभद्रा","महानदी"],1,"The dam lies on the Telangana–Andhra Pradesh border and is one of the largest masonry dams.","यह बाँध तेलंगाना–आंध्र प्रदेश सीमा पर है और सबसे बड़े चिनाई वाले बाँधों में से है।"],
    ["M","The Siachen Glacier lies in which mountain range?","सियाचिन हिमनद किस पर्वत श्रृंखला में है?",["Pir Panjal","Karakoram","Zanskar","Shiwalik"],["पीर पंजाल","काराकोरम","ज़ांस्कर","शिवालिक"],1,"Siachen is about 76 km long, one of the longest glaciers outside the polar regions.","सियाचिन लगभग 76 किमी लंबा है और ध्रुवीय क्षेत्रों के बाहर सबसे लंबे हिमनदों में है।"],
    ["M","The Rohtang Pass lies in which state?","रोहतांग दर्रा किस राज्य में है?",["Himachal Pradesh","Uttarakhand","Sikkim","Arunachal Pradesh"],["हिमाचल प्रदेश","उत्तराखंड","सिक्किम","अरुणाचल प्रदेश"],0,"Rohtang (about 3,978 m) links the Kullu Valley with Lahaul and Spiti.","रोहतांग (लगभग 3,978 मी) कुल्लू घाटी को लाहौल-स्पीति से जोड़ता है।"],
    ["M","Which range lies between the Narmada and Tapi valleys?","नर्मदा और तापी घाटियों के बीच कौन-सी श्रृंखला है?",["Vindhya","Satpura","Aravalli","Maikal"],["विंध्य","सतपुड़ा","अरावली","मैकल"],1,"The Satpura range runs east–west between the two west-flowing rivers.","सतपुड़ा श्रृंखला पश्चिम की ओर बहने वाली इन दोनों नदियों के बीच पूर्व–पश्चिम फैली है।"],
    ["M","The Western and Eastern Ghats meet at which hills?","पश्चिमी और पूर्वी घाट किन पहाड़ियों पर मिलते हैं?",["Nilgiri","Cardamom","Palani","Anamalai"],["नीलगिरि","इलायची","पलनी","अनामलाई"],0,"The Nilgiri Hills form the junction of the two Ghats in the south.","नीलगिरि की पहाड़ियाँ दक्षिण में दोनों घाटों का संगम बनाती हैं।"],
    ["M","The Dhauladhar and Pir Panjal ranges belong to which Himalayan division?","धौलाधार और पीर पंजाल श्रेणियाँ हिमालय के किस भाग में आती हैं?",["Greater Himalaya (Himadri)","Lesser Himalaya (Himachal)","Shiwaliks","Trans-Himalaya"],["वृहत हिमालय (हिमाद्रि)","लघु हिमालय (हिमाचल)","शिवालिक","ट्रांस-हिमालय"],1,"The Lesser Himalaya lies between the Himadri and the Shiwaliks, at 3,700–4,500 m.","लघु हिमालय हिमाद्रि और शिवालिक के बीच लगभग 3,700–4,500 मी की ऊँचाई पर है।"],
    ["S","Which state had the highest literacy rate in the 2011 Census?","2011 की जनगणना में सबसे अधिक साक्षरता दर किस राज्य की थी?",["Kerala","Goa","Mizoram","Tripura"],["केरल","गोवा","मिज़ोरम","त्रिपुरा"],0,"Kerala's literacy rate was about 94 per cent.","केरल की साक्षरता दर लगभग 94 प्रतिशत थी।"],
    ["S","Which state has the largest forest area in India?","भारत में सबसे अधिक वन क्षेत्र किस राज्य में है?",["Madhya Pradesh","Rajasthan","Gujarat","Punjab"],["मध्य प्रदेश","राजस्थान","गुजरात","पंजाब"],0,"Madhya Pradesh has the largest forest cover by area. Mizoram has the highest share of its land under forest.","मध्य प्रदेश में क्षेत्रफल के हिसाब से सबसे अधिक वन हैं। अपनी भूमि के अनुपात में सबसे अधिक वन मिज़ोरम में हैं।"],
    ["S","Which state was formed in 1953 as the first linguistic state?","1953 में पहले भाषाई राज्य के रूप में कौन-सा राज्य बना?",["Karnataka","Kerala","Andhra State","Gujarat"],["कर्नाटक","केरल","आंध्र राज्य","गुजरात"],2,"Andhra State was carved out of Madras State for Telugu speakers.","तेलुगु भाषियों के लिए मद्रास राज्य से आंध्र राज्य अलग किया गया।"],
    ["S","Which is the newest state of India?","भारत का सबसे नया राज्य कौन-सा है?",["Chhattisgarh","Jharkhand","Uttarakhand","Telangana"],["छत्तीसगढ़","झारखंड","उत्तराखंड","तेलंगाना"],3,"Telangana was formed on 2 June 2014 from Andhra Pradesh.","तेलंगाना 2 जून 2014 को आंध्र प्रदेश से अलग होकर बना।"],
    ["S","After Rajasthan, which is the second-largest state by area?","राजस्थान के बाद क्षेत्रफल में दूसरा सबसे बड़ा राज्य कौन-सा है?",["Maharashtra","Madhya Pradesh","Uttar Pradesh","Gujarat"],["महाराष्ट्र","मध्य प्रदेश","उत्तर प्रदेश","गुजरात"],1,"Madhya Pradesh is just ahead of Maharashtra, at about 3.08 lakh sq km.","मध्य प्रदेश लगभग 3.08 लाख वर्ग किमी के साथ महाराष्ट्र से थोड़ा ही आगे है।"],
    ["C","Which soil gets its red colour from iron oxide?","कौन-सी मिट्टी अपना लाल रंग आयरन ऑक्साइड से पाती है?",["Alluvial soil","Black soil","Red soil","Peaty soil"],["जलोढ़ मिट्टी","काली मिट्टी","लाल मिट्टी","पीट मिट्टी"],2,"Red soil forms on crystalline rocks and is common in the south and east of the Deccan.","लाल मिट्टी रवेदार चट्टानों पर बनती है और दक्कन के दक्षिण व पूर्व में आम है।"],
    ["C","'Loo' is a hot, dry wind that blows in which region and season?","'लू' किस क्षेत्र और ऋतु में चलने वाली गर्म, शुष्क पवन है?",["North and northwest India in summer","Kerala in winter","Assam in monsoon","Tamil Nadu in autumn"],["उत्तर और उत्तर-पश्चिम भारत में गर्मियों में","केरल में सर्दियों में","असम में मानसून में","तमिलनाडु में शरद में"],0,"Loo blows over the plains in May and June, often above 45 degrees Celsius.","लू मई–जून में मैदानों पर चलती है और तापमान अक्सर 45 डिग्री सेल्सियस से ऊपर होता है।"],
    ["C","Winter rain in north-west India, helpful for wheat, is caused by which system?","उत्तर-पश्चिम भारत में सर्दियों की वर्षा, जो गेहूँ के लिए लाभदायक है, किस प्रणाली से होती है?",["Western disturbances","Retreating monsoon","Cyclones of the Bay of Bengal","Sea breeze"],["पश्चिमी विक्षोभ","लौटता मानसून","बंगाल की खाड़ी के चक्रवात","समुद्री पवन"],0,"Western disturbances come from the Mediterranean region and bring winter rain and snow.","पश्चिमी विक्षोभ भूमध्य सागर क्षेत्र से आते हैं और सर्दियों में वर्षा और बर्फ़बारी लाते हैं।"],
    ["C","Sambhar Lake, India's largest inland saline lake, is in which state?","भारत की सबसे बड़ी अंतर्देशीय खारी झील सांभर किस राज्य में है?",["Gujarat","Rajasthan","Haryana","Punjab"],["गुजरात","राजस्थान","हरियाणा","पंजाब"],1,"Salt is produced from Sambhar Lake, which lies west of Jaipur.","जयपुर के पश्चिम में स्थित सांभर झील से नमक बनाया जाता है।"],
    ["C","Which national park in Assam is famous for the one-horned rhinoceros?","असम का कौन-सा राष्ट्रीय उद्यान एक सींग वाले गैंडे के लिए प्रसिद्ध है?",["Kaziranga","Manas","Jim Corbett","Gir"],["काज़ीरंगा","मानस","जिम कॉर्बेट","गिर"],0,"Kaziranga is a UNESCO World Heritage Site on the Brahmaputra floodplain.","काज़ीरंगा ब्रह्मपुत्र के बाढ़ के मैदान में स्थित यूनेस्को विश्व धरोहर स्थल है।"]
  ],
  col:[
    ["R","The Indus Waters Treaty (1960) gave India control over which three rivers?","सिंधु जल संधि (1960) ने भारत को किन तीन नदियों पर नियंत्रण दिया?",["Ravi, Beas and Sutlej","Indus, Jhelum and Chenab","Ganga, Yamuna and Ghaghara","Narmada, Tapi and Mahi"],["रावी, ब्यास और सतलुज","सिंधु, झेलम और चिनाब","गंगा, यमुना और घाघरा","नर्मदा, तापी और माही"],0,"The three eastern rivers went to India. Pakistan received the western rivers: Indus, Jhelum and Chenab.","तीन पूर्वी नदियाँ भारत को मिलीं। पाकिस्तान को पश्चिमी नदियाँ सिंधु, झेलम और चिनाब मिलीं।"],
    ["R","The Farakka Barrage was built mainly to send Ganga water into which channel?","फरक्का बैराज मुख्य रूप से गंगा का पानी किस धारा में भेजने के लिए बना?",["Padma","Bhagirathi–Hooghly","Damodar","Teesta"],["पद्मा","भागीरथी–हुगली","दामोदर","तीस्ता"],1,"The aim was to flush silt and keep Kolkata port navigable.","उद्देश्य गाद बहाकर कोलकाता बंदरगाह को नौगम्य बनाए रखना था।"],
    ["R","Which peninsular river has the largest drainage basin?","किस प्रायद्वीपीय नदी का अपवाह बेसिन सबसे बड़ा है?",["Godavari","Krishna","Mahanadi","Kaveri"],["गोदावरी","कृष्णा","महानदी","कावेरी"],0,"The Godavari basin covers about 3.1 lakh sq km across several states.","गोदावरी का बेसिन कई राज्यों में लगभग 3.1 लाख वर्ग किमी में फैला है।"],
    ["R","Which is the longest west-flowing river of peninsular India?","प्रायद्वीपीय भारत की सबसे लंबी पश्चिम की ओर बहने वाली नदी कौन-सी है?",["Narmada","Tapi","Mahi","Sabarmati"],["नर्मदा","तापी","माही","साबरमती"],0,"The Narmada is about 1,312 km long and flows through a rift valley.","नर्मदा लगभग 1,312 किमी लंबी है और भ्रंश घाटी से बहती है।"],
    ["R","The Alaknanda and Bhagirathi meet at which place to form the Ganga?","अलकनंदा और भागीरथी किस स्थान पर मिलकर गंगा बनाती हैं?",["Rudraprayag","Devprayag","Karnaprayag","Haridwar"],["रुद्रप्रयाग","देवप्रयाग","कर्णप्रयाग","हरिद्वार"],1,"Devprayag in Uttarakhand is where the river takes the name Ganga.","उत्तराखंड का देवप्रयाग वह स्थान है जहाँ से यह नदी गंगा कहलाती है।"],
    ["M","The Himalayas were formed by the collision of the Indian plate with which plate?","भारतीय प्लेट की किस प्लेट से टक्कर से हिमालय बना?",["Eurasian plate","African plate","Pacific plate","Antarctic plate"],["यूरेशियाई प्लेट","अफ़्रीकी प्लेट","प्रशांत प्लेट","अंटार्कटिक प्लेट"],0,"The collision began about 50 million years ago and the Himalayas are still rising.","यह टक्कर लगभग पाँच करोड़ वर्ष पहले शुरू हुई और हिमालय आज भी ऊपर उठ रहा है।"],
    ["M","Around which peak does the Brahmaputra (Tsangpo) make a sharp turn into India?","ब्रह्मपुत्र (सांगपो) किस चोटी के चारों ओर तीखा मोड़ लेकर भारत में आती है?",["Nanda Devi","Namcha Barwa","Kamet","Gurla Mandhata"],["नंदा देवी","नामचा बरवा","कामेट","गुरला मांधाता"],1,"The river enters Arunachal Pradesh as the Siang or Dihang after the great bend.","इस विशाल मोड़ के बाद नदी अरुणाचल प्रदेश में सियांग या दिहांग के नाम से प्रवेश करती है।"],
    ["M","The Garo, Khasi and Jaintia hills are part of which plateau?","गारो, खासी और जयंतिया पहाड़ियाँ किस पठार का भाग हैं?",["Malwa","Meghalaya (Shillong)","Chota Nagpur","Deccan Trap"],["मालवा","मेघालय (शिलांग)","छोटा नागपुर","दक्कन ट्रैप"],1,"The Meghalaya Plateau is a detached part of the ancient peninsular block.","मेघालय का पठार प्राचीन प्रायद्वीपीय खंड का एक अलग हुआ हिस्सा है।"],
    ["M","Which is the highest mountain peak lying entirely within India?","पूरी तरह भारत के भीतर स्थित सबसे ऊँची पर्वत चोटी कौन-सी है?",["Kangchenjunga","Nanda Devi","Kamet","Trisul"],["कंचनजंगा","नंदा देवी","कामेट","त्रिशूल"],1,"Nanda Devi (7,816 m) is in Uttarakhand. Kangchenjunga is higher but lies on the Sikkim–Nepal border.","नंदा देवी (7,816 मी) उत्तराखंड में है। कंचनजंगा अधिक ऊँची है पर सिक्किम–नेपाल सीमा पर है।"],
    ["M","The Palghat Gap separates the Nilgiri Hills from which hills?","पालघाट दर्रा नीलगिरि पहाड़ियों को किन पहाड़ियों से अलग करता है?",["Anamalai","Aravalli","Satpura","Vindhya"],["अनामलाई","अरावली","सतपुड़ा","विंध्य"],0,"The gap links Kerala and Tamil Nadu and carries road and rail routes.","यह दर्रा केरल और तमिलनाडु को जोड़ता है और यहाँ से सड़क व रेल मार्ग गुज़रते हैं।"],
    ["S","Which state has the longest border with Bangladesh?","बांग्लादेश के साथ सबसे लंबी सीमा किस राज्य की है?",["West Bengal","Assam","Tripura","Meghalaya"],["पश्चिम बंगाल","असम","त्रिपुरा","मेघालय"],0,"West Bengal shares a border of about 2,200 km with Bangladesh.","पश्चिम बंगाल की बांग्लादेश के साथ लगभग 2,200 किमी लंबी सीमा है।"],
    ["S","Which state has the largest number of districts?","सबसे अधिक ज़िलों वाला राज्य कौन-सा है?",["Maharashtra","Uttar Pradesh","Madhya Pradesh","Bihar"],["महाराष्ट्र","उत्तर प्रदेश","मध्य प्रदेश","बिहार"],1,"Uttar Pradesh has 75 districts.","उत्तर प्रदेश में 75 ज़िले हैं।"],
    ["S","Loktak Lake, with its floating phumdis, is in which state?","तैरती फुमदियों वाली लोकटक झील किस राज्य में है?",["Manipur","Nagaland","Mizoram","Tripura"],["मणिपुर","नागालैंड","मिज़ोरम","त्रिपुरा"],0,"Keibul Lamjao, the only floating national park in the world, sits on Loktak.","दुनिया का एकमात्र तैरता राष्ट्रीय उद्यान केइबुल लामजाओ लोकटक झील पर है।"],
    ["S","Which city is the capital of Assam?","असम की राजधानी कौन-सा शहर है?",["Guwahati","Dispur","Shillong","Imphal"],["गुवाहाटी","दिसपुर","शिलांग","इंफाल"],1,"Dispur lies within Guwahati, the largest city of the state.","दिसपुर राज्य के सबसे बड़े शहर गुवाहाटी के भीतर स्थित है।"],
    ["S","Ranchi, on the Chota Nagpur Plateau, is the capital of which state?","छोटा नागपुर पठार पर बसा राँची किस राज्य की राजधानी है?",["Odisha","Jharkhand","Chhattisgarh","West Bengal"],["ओडिशा","झारखंड","छत्तीसगढ़","पश्चिम बंगाल"],1,"Ranchi sits at about 650 m, so its climate is cooler than the nearby plains.","राँची लगभग 650 मी की ऊँचाई पर है, इसलिए यहाँ की जलवायु आसपास के मैदानों से ठंडी है।"],
    ["C","The black soil of the Deccan is mainly derived from which rock?","दक्कन की काली मिट्टी मुख्य रूप से किस चट्टान से बनी है?",["Granite","Basalt (Deccan lava)","Limestone","Sandstone"],["ग्रेनाइट","बेसाल्ट (दक्कन का लावा)","चूना पत्थर","बलुआ पत्थर"],1,"The Deccan Trap lava flows weathered into regur, rich in clay, lime and iron.","दक्कन ट्रैप के लावा प्रवाह अपक्षयित होकर रेगुर बने, जो चिकनी मिट्टी, चूने और लोहे से भरपूर है।"],
    ["C","Which jet stream is linked with the summer monsoon over peninsular India?","प्रायद्वीपीय भारत में ग्रीष्मकालीन मानसून से कौन-सी जेट धारा जुड़ी है?",["Polar front jet","Tropical Easterly Jet","Subtropical Westerly Jet","Arctic jet"],["ध्रुवीय अग्र जेट","उष्णकटिबंधीय पूर्वी जेट","उपोष्ण पछुआ जेट","आर्कटिक जेट"],1,"The Tropical Easterly Jet blows in the upper air during summer and supports the monsoon.","उष्णकटिबंधीय पूर्वी जेट गर्मियों में ऊपरी वायुमंडल में चलती है और मानसून को बल देती है।"],
    ["C","Which is India's largest Ramsar wetland by area?","क्षेत्रफल में भारत की सबसे बड़ी रामसर आर्द्रभूमि कौन-सी है?",["Chilika","Sundarbans","Loktak","Vembanad–Kol"],["चिल्का","सुंदरबन","लोकटक","वेम्बनाड–कोल"],1,"The Sundarbans Wetland covers about 4.2 lakh hectares.","सुंदरबन आर्द्रभूमि लगभग 4.2 लाख हेक्टेयर में फैली है।"],
    ["C","Mawsynram's extreme rainfall is mainly due to which process?","मावसिनराम की अत्यधिक वर्षा मुख्य रूप से किस प्रक्रिया के कारण है?",["Orographic lifting by the Khasi Hills","Western disturbances","Land breeze","Cold ocean currents"],["खासी पहाड़ियों द्वारा पर्वतीय उत्थान","पश्चिमी विक्षोभ","स्थल समीर","ठंडी समुद्री धाराएँ"],0,"Moist monsoon winds are funnelled up the hills, cool, and release heavy rain.","नमी भरी मानसूनी हवाएँ पहाड़ियों पर ऊपर चढ़कर ठंडी होती हैं और भारी वर्षा करती हैं।"],
    ["C","Which forest type covers the windward slopes of the southern Western Ghats?","दक्षिणी पश्चिमी घाट की पवनाभिमुख ढलानों पर कौन-सा वन प्रकार है?",["Thorn forest","Tropical wet evergreen forest","Mangrove forest","Alpine forest"],["कँटीले वन","उष्णकटिबंधीय आर्द्र सदाबहार वन","मैंग्रोव वन","अल्पाइन वन"],1,"Rainfall above 200 cm a year supports tall, dense evergreen trees.","200 सेमी से अधिक वार्षिक वर्षा ऊँचे और घने सदाबहार वृक्षों को पोषण देती है।"]
  ],
  pcs:[
    ["R","Which river is called the Tsangpo in Tibet?","तिब्बत में किस नदी को सांगपो कहा जाता है?",["Brahmaputra","Indus","Sutlej","Teesta"],["ब्रह्मपुत्र","सिंधु","सतलुज","तीस्ता"],0,"The Tsangpo becomes the Siang in Arunachal Pradesh and the Brahmaputra in Assam.","सांगपो अरुणाचल प्रदेश में सियांग और असम में ब्रह्मपुत्र कहलाती है।"],
    ["R","Which river rises near Mount Kailash and Lake Mansarovar and enters India in Ladakh?","कौन-सी नदी कैलाश पर्वत और मानसरोवर के पास से निकलकर लद्दाख में भारत में आती है?",["Indus","Ganga","Narmada","Godavari"],["सिंधु","गंगा","नर्मदा","गोदावरी"],0,"The Indus is about 3,180 km long overall and flows mainly through Pakistan.","सिंधु कुल लगभग 3,180 किमी लंबी है और मुख्यतः पाकिस्तान से होकर बहती है।"],
    ["R","The Hirakud Dam, among the longest earthen dams, is on which river?","सबसे लंबे मिट्टी के बाँधों में से एक हीराकुड बाँध किस नदी पर है?",["Mahanadi","Godavari","Krishna","Kaveri"],["महानदी","गोदावरी","कृष्णा","कावेरी"],0,"Hirakud, in Odisha, with its dykes is about 25 km long.","ओडिशा का हीराकुड अपने तटबंधों सहित लगभग 25 किमी लंबा है।"],
    ["R","The Chambal river is a tributary of which river?","चंबल नदी किस नदी की सहायक नदी है?",["Ganga","Yamuna","Narmada","Son"],["गंगा","यमुना","नर्मदा","सोन"],1,"The Chambal rises near Mhow in Madhya Pradesh and is known for its ravines.","चंबल मध्य प्रदेश में महू के पास से निकलती है और अपने बीहड़ों के लिए जानी जाती है।"],
    ["R","The Jog Falls in Karnataka are formed by which river?","कर्नाटक के जोग जलप्रपात किस नदी से बनते हैं?",["Kaveri","Sharavathi","Tungabhadra","Netravati"],["कावेरी","शरावती","तुंगभद्रा","नेत्रावती"],1,"The Sharavathi drops about 253 m at Jog, one of the highest plunge falls in India.","शरावती जोग में लगभग 253 मी नीचे गिरती है, जो भारत के सबसे ऊँचे जलप्रपातों में है।"],
    ["M","The Jawahar Tunnel on the Jammu–Srinagar highway pierces which pass?","जम्मू–श्रीनगर राजमार्ग की जवाहर सुरंग किस दर्रे को भेदती है?",["Zoji La","Banihal Pass","Rohtang Pass","Khardung La"],["ज़ोजिला","बनिहाल दर्रा","रोहतांग दर्रा","खारदुंग ला"],1,"The tunnel lies in the Pir Panjal range at about 2,194 m.","यह सुरंग पीर पंजाल श्रेणी में लगभग 2,194 मी की ऊँचाई पर है।"],
    ["M","The Valley of Flowers National Park lies in which state?","फूलों की घाटी राष्ट्रीय उद्यान किस राज्य में है?",["Himachal Pradesh","Uttarakhand","Sikkim","Jammu and Kashmir"],["हिमाचल प्रदेश","उत्तराखंड","सिक्किम","जम्मू और कश्मीर"],1,"The valley in Chamoli district blooms in the monsoon months and is a UNESCO site.","चमोली ज़िले की यह घाटी मानसून के महीनों में खिलती है और यूनेस्को स्थल है।"],
    ["M","Mahendragiri, a well-known peak, belongs to which hill system?","प्रसिद्ध चोटी महेंद्रगिरि किस पर्वत तंत्र की है?",["Western Ghats","Eastern Ghats","Aravalli","Himalaya"],["पश्चिमी घाट","पूर्वी घाट","अरावली","हिमालय"],1,"Mahendragiri (about 1,500 m) is in Odisha's Gajapati district.","महेंद्रगिरि (लगभग 1,500 मी) ओडिशा के गजपति ज़िले में है।"],

  LESSONS.himalaya=[
  [0,`## What are the Himalayas?
The Himalayas are the highest mountain range in the world. They stand along the northern border of India and stretch for about 2,400 km, from Jammu and Kashmir in the west to Arunachal Pradesh in the east. The name means "abode of snow".`],
  [0,`## Why are they important?
- They block the cold winds of Central Asia, so north India is warmer in winter than it would otherwise be.
- They stop the monsoon winds and force them to drop rain over the plains.
- Great rivers such as the **Ganga**, **Yamuna** and **Brahmaputra** begin here.
- Snow, glaciers, forests, wildlife, pilgrim places and hill stations are all found here.`],
  [0,`## Three parallel ranges
The Himalayas are not one wall but three ranges that run side by side:
- **Himadri** (Greater Himalaya): the highest and northernmost range, snow-covered all year. Kangchenjunga and Nanda Devi belong here.
- **Himachal** (Lesser Himalaya): the middle range, with hill stations such as Shimla, Mussoorie and Nainital.
- **Shiwaliks**: the lowest and outermost range, made of loose sand, gravel and clay.`],
  [1,`## How were they formed?
About 50 million years ago the Indian plate, moving north, collided with the Eurasian plate. The sea that lay between them, the Tethys Sea, was squeezed, and the sediments on its floor were pushed up and folded into mountains. That is why the Himalayas are called **fold mountains**. They are young mountains, and they are still rising by a few millimetres every year, which is why the region has many earthquakes.`],
  [1,`## Heights to remember
- **Kangchenjunga** (8,586 m) in Sikkim is the highest peak in India and the third highest in the world.
- **Nanda Devi** (7,816 m) in Uttarakhand is the highest peak that lies completely inside India.
- **Mount Everest** (about 8,849 m) is in Nepal and Tibet, not in India.`],
  [2,`## Divisions in detail
- **Himadri**: average height above 6,000 m, with a granite core and many glaciers such as Gangotri and Yamunotri.
- **Himachal**: roughly 3,700 to 4,500 m high. Its main ranges are Pir Panjal (the longest), Dhauladhar and Mussoorie. It holds famous valleys such as Kashmir, Kullu and Kangra.
- **Shiwaliks**: about 900 to 1,200 m. Between the Shiwaliks and the Himachal there are broad flat valleys called **Duns**, for example Dehradun and Patli Dun.`],
  [2,`## Regional divisions
The Himalayas are also divided by the rivers that cut across them, from west to east:
- **Punjab Himalaya**: between the Indus and the Sutlej.
- **Kumaon Himalaya**: between the Sutlej and the Kali.
- **Nepal Himalaya**: between the Kali and the Teesta.
- **Assam Himalaya**: between the Teesta and the Dihang (Siang).
Beyond the Dihang, the hills of the north-east (Patkai, Naga and Mizo hills) are called the **Purvanchal**.`],
  [2,`## Climate and vegetation
Plants change with height. At the foot there are tropical forests. Higher up come temperate forests of oak and chestnut, then conifers such as pine, deodar and fir, then alpine meadows (called *bugyals* in Uttarakhand and *margs* in Kashmir), and finally bare rock and snow. The southern slopes get heavy monsoon rain, while the rain-shadow regions behind the ranges, such as Ladakh and Spiti, are cold deserts.`],
  [3,`## Rivers and tectonics
- Many Himalayan rivers, such as the Indus, Sutlej and Brahmaputra, are **antecedent rivers**: they existed before the mountains rose and kept cutting deep gorges as the land lifted.
- The **Main Central Thrust** separates the Greater from the Lesser Himalaya. The **Main Boundary Thrust** separates the Lesser Himalaya from the Shiwaliks. The **Main Frontal Thrust** marks the outer edge of the Shiwaliks. Earthquakes and landslides are common along these faults, and much of the Himalaya lies in Seismic Zones IV and V.
- The **Karakoram** range, north of the Greater Himalaya, holds the Siachen Glacier (about 76 km long), one of the longest glaciers outside the polar regions.`],
  [4,`## Facts for State PCS
- Important passes: Banihal and Rohtang (Pir Panjal), Zoji La (between Kashmir and Ladakh), Nathu La and Jelep La (Sikkim), Shipki La (Himachal Pradesh), Lipulekh and Niti (Uttarakhand).
- The Siachen Glacier lies in the Karakoram. Kamet (7,756 m) is in Uttarakhand. Saramati is the highest peak of the Naga Hills.
- The Himalayas are the source of the Indus, Ganga and Brahmaputra systems.

## Common exam traps
- Everest is not in India. Kangchenjunga is the highest peak in India, while Nanda Devi is the highest peak entirely inside India.
- Pir Panjal belongs to the Lesser Himalaya, not the Greater.
- The Shiwaliks are the youngest and outermost range, not the oldest.`],
  [5,`## Significance and challenges (Mains view)
- **Strategic**: the northern frontier of India, with border sensitivities in Ladakh and Arunachal Pradesh. High-altitude roads and tunnels such as the Atal Tunnel under Rohtang (about 9 km) keep these areas connected.
- **Ecological**: the Eastern Himalaya is a global biodiversity hotspot. Glaciers are retreating because of climate change, and glacial lake outburst floods are a growing danger.
- **Hazards**: earthquakes, landslides, cloudbursts and flash floods, as in the 2013 Kedarnath disaster.
- **Development pressure**: hydropower projects, road building, tourism and deforestation strain a fragile region. The **National Mission for Sustaining the Himalayan Ecosystem**, one of the eight missions under the National Action Plan on Climate Change, aims to protect it.

## Possible Mains questions
- Explain how the Himalayas were formed and why they remain tectonically active.
- Discuss the ecological fragility of the Himalayas and suggest measures for sustainable development.`]

  [0,`## What are the Northern Plains?
The Northern Plains are a huge, flat and very fertile stretch of land between the Himalayas in the north and the Peninsular Plateau in the south. They are about 2,400 km long and roughly 240 to 320 km wide, and they cover Punjab, Haryana, Delhi, Uttar Pradesh, Bihar, West Bengal and Assam.`],
  [0,`## How were they made?
The plains were not always there. Rivers such as the Indus, Ganga and Brahmaputra carried mud and sand (called **alluvium**) down from the mountains for millions of years and spread it over the land. This soft, rich soil made the plains flat and fertile.`],
  [0,`## Why are they important?
- Alluvial soil and plenty of river water give very good harvests of wheat, rice, sugarcane and jute.
- The land is flat, so roads, railways and canals are easy to build.
- A very large share of India's people live here, in cities such as Delhi, Lucknow, Patna and Kolkata.`],
  [1,`## Three river plains
- **Punjab Plains**: the western part, drained by the Indus and its tributaries. They are divided into several **doabs** (land between two rivers).
- **Ganga Plains**: the largest part, between the Ghaggar and the Teesta rivers, spread across Haryana, Delhi, Uttar Pradesh, Bihar, Jharkhand and West Bengal.
- **Brahmaputra Plains**: the eastern part, in Assam.`],
  [1,`## Four belts from north to south
The plains can be divided into four belts according to how the land and soil look:
- **Bhabar**: a narrow belt of pebbles at the foot of the Shiwaliks, where streams sink underground.
- **Terai**: a wet, marshy belt south of the Bhabar, where the streams come up again. It was thick forest and is now mostly farmland.
- **Bhangar**: older alluvium on higher land, often with lime nodules called *kankar*.
- **Khadar**: newer alluvium in the flood plains, renewed by floods every year and more fertile.`],
  [2,`## Soil and farming
Alluvial soil is rich in potash and lime but poor in nitrogen and humus, so farmers add fertiliser. Wheat is grown mostly in the drier west (Punjab, Haryana, western Uttar Pradesh) and rice in the wetter east (Bihar, West Bengal, Assam). Sugarcane is important in Uttar Pradesh, and jute in the Ganga delta. The Green Revolution of the 1960s began in Punjab, Haryana and western Uttar Pradesh.`],
  [2,`## Doabs of the Punjab plains
A **doab** is the land between two rivers. The Punjab plains have five famous doabs: the **Bist–Jalandhar** (between the Beas and Sutlej), **Bari** (Beas and Ravi), **Rechna** (Ravi and Chenab), **Chaj** (Chenab and Jhelum) and **Sind Sagar** (Jhelum and Indus). The first two lie mainly in Indian Punjab. The Ganga–Yamuna Doab in Uttar Pradesh is also famous.`],
  [3,`## Rivers on the plains
On flat land rivers slow down and swing from side to side. They form **meanders**, cut-off bends called **oxbow lakes**, and natural embankments called **levees**. The **Kosi** often shifts its course and causes floods in north Bihar, so it is called the "Sorrow of Bihar". Near the sea the Ganga and Brahmaputra build the world's largest delta, which holds the Sundarbans mangrove forest.

## Geological story
The plains lie in a deep trough in front of the rising Himalaya. This trough was filled over millions of years with very thick layers of sediment brought by rivers.`],
  [4,`## Facts for State PCS
- Ganga Plain between the Ghaggar and the Teesta; Brahmaputra Plain in Assam; Punjab Plain drained by the Indus system.
- Order of belts from the Shiwaliks southward: Bhabar, Terai, Bhangar, Khadar.
- The Ganga delta (Sundarbans) is the largest delta in the world.
- Majuli, in the Brahmaputra in Assam, is among the largest river islands in the world.

## Common exam traps
- Khadar is the newer and more fertile alluvium; Bhangar is older.
- Bhabar has pebbles and no surface streams; Terai is marshy.`],
  [5,`## Issues of the plains (Mains view)
- **Water**: heavy groundwater use for rice and wheat has lowered water tables in Punjab and Haryana. Floods hit Bihar and Assam almost every monsoon.
- **Soil**: waterlogging and salinity damage land in parts of Punjab, Haryana and Uttar Pradesh.
- **Health**: arsenic in groundwater affects parts of the Ganga plain, especially West Bengal and Bihar.
- **Air and crops**: stubble burning and crop concentration on wheat and rice raise environmental and economic questions about diversifying crops.
- **Population**: very high density puts pressure on land, cities and rivers.

## Possible Mains questions
- Why are the Northern Plains the most densely populated part of India?
- Discuss the causes of recurrent floods in the Ganga and Brahmaputra plains and the measures to manage them.`]
